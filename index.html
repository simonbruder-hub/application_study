<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>application_study</title>
<style>
  :root { color-scheme: light dark; --bg: #edf1f0; --fg: #132024; --muted: #5f7076; --card: #fbfcfc; --line: #d7dfdd; --accent: #c63a29; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1214; --fg: #e3ebeb; --muted: #8b9b9e; --card: #151b1e; --line: #263135; --accent: #f0644e; } }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.app { display: block; padding: 18px 20px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; }
  a.app:hover { border-color: var(--accent); }
  a.app b { display: block; font-size: 18px; }
  a.app span { color: var(--muted); font-size: 14px; }
  a.app + a.app { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>application_study</h1>
  <p>Diverse Apps zur Unterstützung.</p>
  <a class="app" href="taktwerk/"><b>Taktwerk</b><span>Pomodoro-Timer und Stechuhr für Lernen und Arbeit: Projekte, Aufgaben, Auswertung, sechs Stile, installierbar auf Laptop und Handy</span></a>
</main>
</body>
</html>
