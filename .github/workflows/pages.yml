name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            taktwerk/package-lock.json
            lernlabor/package-lock.json
      - name: Abhängigkeiten installieren
        working-directory: taktwerk
        run: npm ci
      - name: Taktwerk bauen (PWA und Einzeldatei)
        working-directory: taktwerk
        # Supabase-Verbindung der veröffentlichten App. Der Publishable key ist absichtlich öffentlich,
        # die Daten schützt Row-Level-Security (siehe taktwerk/supabase/README.md). GitHub-Variablen
        # mit denselben Namen haben Vorrang.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://xlbddpaxwjgseqxaicuf.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_HawYMwgitp0Jo9CmA31oIA_tA3Hd-ik' }}
        run: |
          npm run build
          npm run build:single
      - name: Lernlabor bauen (PWA)
        working-directory: lernlabor
        run: |
          npm ci
          npm run build
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/taktwerk _site/lernlabor
          cp index.html _site/
          cp -r taktwerk/site/. _site/taktwerk/
          cp -r taktwerk/dist/app _site/taktwerk/app
          cp taktwerk/dist/single/index.html _site/taktwerk/taktwerk.html
          cp -r lernlabor/dist/app _site/lernlabor/app
          cp lernlabor/site/index.html _site/lernlabor/index.html
          # Frühere Adresse (/pomodoro-planer/v2/) leitet auf die App weiter
          cp -r .github/pages-legacy/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
