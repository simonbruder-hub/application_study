name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pomodoro-planer/package-lock.json
      - name: Abhängigkeiten installieren
        working-directory: pomodoro-planer
        run: npm ci
      - name: v1-Einzeldatei bauen
        working-directory: pomodoro-planer
        run: npm run build
      - name: v2 bauen (PWA und Einzeldatei)
        working-directory: pomodoro-planer
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build:v2
          npm run build:single
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/pomodoro-planer
          cp index.html _site/
          rsync -a \
            --exclude node_modules --exclude src --exclude dist --exclude scripts --exclude supabase --exclude v2 \
            --exclude tests --exclude 'package*.json' --exclude '*.config.ts' --exclude 'tsconfig.json' --exclude '.npmrc' \
            pomodoro-planer/ _site/pomodoro-planer/
          cp -r pomodoro-planer/dist/v2 _site/pomodoro-planer/v2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
