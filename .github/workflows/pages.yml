name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Einzeldatei bauen
        run: node pomodoro-planer/scripts/build.mjs
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp index.html _site/
          cp -r pomodoro-planer _site/pomodoro-planer
          rm -rf _site/pomodoro-planer/dist _site/pomodoro-planer/scripts _site/pomodoro-planer/package.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
