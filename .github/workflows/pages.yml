name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taktwerk/package-lock.json
      - name: Abhängigkeiten installieren
        working-directory: taktwerk
        run: npm ci
      - name: Taktwerk bauen (PWA und Einzeldatei)
        working-directory: taktwerk
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          npm run build:single
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/taktwerk
          cp index.html _site/
          cp -r taktwerk/site/. _site/taktwerk/
          cp -r taktwerk/dist/app _site/taktwerk/app
          cp taktwerk/dist/single/index.html _site/taktwerk/taktwerk.html
          # Frühere Adresse (/pomodoro-planer/v2/) leitet auf die App weiter
          cp -r .github/pages-legacy/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
