name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: taktwerk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taktwerk/package-lock.json
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Datenbank-Tests (PostgreSQL 16 des Runners)
        run: npm run db:test
      - name: Build (PWA, Einzeldatei und Desktop)
        run: |
          npm run build
          npm run build:single
          npm run build:desktop
      - name: Browser installieren
        run: npx playwright install --with-deps chromium
      - name: End-to-End-Tests
        run: npm run test:e2e

  lernlabor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lernlabor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lernlabor/package-lock.json
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Unit-Tests (Rechenkern und Aufgaben)
        run: npm test
      - name: Build (PWA)
        run: npm run build
      - name: Browser installieren
        run: npx playwright install --with-deps chromium
      - name: End-to-End-Tests
        run: npm run test:e2e
