name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pomodoro-planer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pomodoro-planer/package-lock.json
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Datenbank-Tests (PostgreSQL 16 des Runners)
        run: npm run db:test
      - name: Build v2 (PWA und Einzeldatei)
        run: |
          npm run build:v2
          npm run build:single
      - name: Browser installieren
        run: npx playwright install --with-deps chromium
      - name: End-to-End-Tests
        run: npm run test:e2e
