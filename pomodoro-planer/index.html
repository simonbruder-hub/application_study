<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro-Planer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pomodoro-Timer mit Aufgaben, Projekt-Tracking, Auswertung von Lern- und Arbeitszeit und Kalender zur Planung.">
<meta name="theme-color" content="#eef2f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Martian+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg id="sprite" xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.5h5M18.5 6.5l1.5-1.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M3.5 6.5l1.6 1.6L8 5.2M11 7h9.5M3.5 12.5l1.6 1.6L8 11.2M11 13h9.5M3.5 18.5l1.6 1.6L8 17.2M11 19h9.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3.5 20.5h17M6.5 17v-5M11.5 17V6.5M16.5 17V10"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.2 5.1A.8.8 0 0 0 8 5.8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.9" y="5" width="3.6" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5h6V7"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5.5 6.5v11l8-5.5z" fill="currentColor" stroke="none"/><path d="M17.5 6v12"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 5v5h5"/><path d="M5.2 15a7.5 7.5 0 1 0 1.3-7.6L4 10"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5.5 21V4M5.5 4.5h11l-2.2 4 2.2 4h-11"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 9.5l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><rect x="11.5" y="11.5" width="6.5" height="5.5" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M10 19.5H4.5V14M19.5 4.5l-6 6M4.5 19.5l6-6"/></symbol>
    <symbol id="i-logo" viewBox="0 0 32 32"><circle cx="16" cy="18.5" r="11" style="fill:var(--tomato)"/><path d="M16 6.5l2.2 3.4 3.9-1.1-1.9 3.4 3.4 1.9-4.2.4H12.6l-4.2-.4 3.4-1.9-1.9-3.4 3.9 1.1z" style="fill:var(--leaf)"/><path d="M16 18.5V13.5M16 18.5l3.6 2.2" style="fill:none;stroke:var(--surface);stroke-width:2.4;stroke-linecap:round"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <aside class="sidebar" aria-label="Hauptnavigation">
    <div class="brand"><svg class="logo" aria-hidden="true"><use href="#i-logo"></use></svg><span>Pomodoro-Planer</span></div>
    <nav class="nav">
      <button type="button" class="nav-item" data-act="go" data-view="fokus" data-nav="fokus"><svg class="ic" aria-hidden="true"><use href="#i-timer"></use></svg><span>Fokus</span><kbd>1</kbd></button>
      <button type="button" class="nav-item" data-act="go" data-view="aufgaben" data-nav="aufgaben"><svg class="ic" aria-hidden="true"><use href="#i-list"></use></svg><span>Aufgaben</span><kbd>2</kbd></button>
      <button type="button" class="nav-item" data-act="go" data-view="projekte" data-nav="projekte"><svg class="ic" aria-hidden="true"><use href="#i-folder"></use></svg><span>Projekte</span><kbd>3</kbd></button>
      <button type="button" class="nav-item" data-act="go" data-view="kalender" data-nav="kalender"><svg class="ic" aria-hidden="true"><use href="#i-calendar"></use></svg><span>Kalender</span><kbd>4</kbd></button>
      <button type="button" class="nav-item" data-act="go" data-view="auswertung" data-nav="auswertung"><svg class="ic" aria-hidden="true"><use href="#i-chart"></use></svg><span>Auswertung</span><kbd>5</kbd></button>
      <button type="button" class="nav-item" data-act="go" data-view="einstellungen" data-nav="einstellungen"><svg class="ic" aria-hidden="true"><use href="#i-sliders"></use></svg><span>Einstellungen</span><kbd>6</kbd></button>
    </nav>
    <div class="mt" data-mini-timer></div>
    <div class="side-foot">
      <button type="button" class="icon-btn" data-act="toggleTheme" data-theme-btn aria-label="Tag/Nacht wechseln"></button>
      <span class="save-state" data-save-state></span>
      <button type="button" class="btn btn-ghost btn-sm" data-act="install" data-install hidden>App installieren</button>
    </div>
  </aside>

  <header class="topbar">
    <div class="brand"><svg class="logo" aria-hidden="true"><use href="#i-logo"></use></svg><span>Pomodoro-Planer</span></div>
    <div class="mt mt-top" data-mini-timer></div>
    <button type="button" class="icon-btn" data-act="toggleTheme" data-theme-btn aria-label="Tag/Nacht wechseln"></button>
    <button type="button" class="icon-btn" data-act="go" data-view="einstellungen" data-nav="einstellungen" aria-label="Einstellungen"><svg class="ic" aria-hidden="true"><use href="#i-sliders"></use></svg></button>
  </header>

  <main id="main" class="main" tabindex="-1"></main>
  <div class="connecting" aria-live="polite"><span>Deine Daten werden geladen …</span></div>

  <nav class="tabbar" aria-label="Navigation">
    <button type="button" class="tab" data-act="go" data-view="fokus" data-nav="fokus"><svg class="ic" aria-hidden="true"><use href="#i-timer"></use></svg><span>Fokus</span></button>
    <button type="button" class="tab" data-act="go" data-view="aufgaben" data-nav="aufgaben"><svg class="ic" aria-hidden="true"><use href="#i-list"></use></svg><span>Aufgaben</span></button>
    <button type="button" class="tab" data-act="go" data-view="projekte" data-nav="projekte"><svg class="ic" aria-hidden="true"><use href="#i-folder"></use></svg><span>Projekte</span></button>
    <button type="button" class="tab" data-act="go" data-view="kalender" data-nav="kalender"><svg class="ic" aria-hidden="true"><use href="#i-calendar"></use></svg><span>Kalender</span></button>
    <button type="button" class="tab" data-act="go" data-view="auswertung" data-nav="auswertung"><svg class="ic" aria-hidden="true"><use href="#i-chart"></use></svg><span>Auswertung</span></button>
  </nav>
</div>

<div id="miniRoot" class="mini-root" hidden></div>
<dialog id="dlg" class="dlg"></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/timer.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/views/fokus.js"></script>
<script src="js/views/aufgaben.js"></script>
<script src="js/views/projekte.js"></script>
<script src="js/views/kalender.js"></script>
<script src="js/views/auswertung.js"></script>
<script src="js/views/einstellungen.js"></script>
<script src="js/app.js"></script>
</body>
</html>
