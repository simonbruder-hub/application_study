        <div class="row-gap">
          <button type="button" class="btn btn-primary" data-act="newProject">${UI.icon('plus')}Projekt anlegen</button>
          ${Store.isEmpty() ? '<button type="button" class="btn btn-ghost" data-act="loadDemo">Beispieldaten ansehen</button>' : ''}
        </div>
      </div>`}`;
  },

  detail(p) {
    const all = Store.projectStats(p.id);
    const w0 = U.startOfWeek(new Date());
    const wk = Store.projectStats(p.id, w0, U.addDays(w0, 7));
    const prog = progressOf(p, all);
    const tasks = Store.state.tasks.filter((t) => t.projectId === p.id).sort((a, b) => taskSort(a, b) || (a.date || '9999').localeCompare(b.date || '9999'));
    const open = tasks.filter((t) => !t.done);
    const done = tasks.filter((t) => t.done);
    const sessions = Store.state.sessions.filter((s) => Store.sessionProject(s)?.id === p.id).sort((a, b) => b.start - a.start);
    // 14-Tage-Verlauf
    const d0 = U.addDays(U.startOfDay(new Date()), -13);
    const days = Array.from({ length: 14 }, (_, i) => {
      const a = U.addDays(d0, i);
      const b = U.addDays(a, 1);
      return { key: U.dateKey(a), label: `${U.WD[U.wdIndex(a)]}`, sec: U.sum(sessions.filter((s) => s.start >= +a && s.start < +b), (s) => s.sec) };
    });
    const chart = Charts.columns({
      id: 'pc14',
      buckets: days.map((d) => ({ label: d.label, sub: U.fmtDay(d.key), values: { p: d.sec } })),
      series: [{ key: 'p', label: p.name, color: `var(--pc-${p.color || 1})` }],
      legend: false,
    });
    return `
    <div class="view-head">
      <div>
        <button type="button" class="link back" data-act="closeProject">${UI.icon('chevron-left')}Alle Projekte</button>
        <h1 class="with-swatch" style="--pc: var(--pc-${p.color || 1})"><span class="pc-swatch"></span>${U.esc(p.name)}</h1>
        <p class="sub-line">${UI.catChip(p.category)}${deadlineBadge(p)}${p.archived ? '<span class="badge">Archiviert</span>' : ''}</p>
      </div>
      <div class="head-actions">
        <button type="button" class="btn btn-ghost" data-act="editProject" data-id="${p.id}">${UI.icon('edit')}Bearbeiten</button>
        <button type="button" class="btn btn-primary" data-act="focusProject" data-id="${p.id}">${UI.icon('play')}Fokussieren</button>
      </div>
    </div>
    ${p.notes ? `<p class="notes">${U.esc(p.notes)}</p>` : ''}
    <div class="tiles">
      <div class="tile"><span class="tile-label">Gesamt</span><span class="tile-value">${U.fmtDur(all.sec)}</span><span class="tile-sub">${all.pomos} Pomodoros</span></div>
      <div class="tile"><span class="tile-label">Diese Woche</span><span class="tile-value">${U.fmtDur(wk.sec)}</span><span class="tile-sub">${wk.pomos} Pomodoros</span></div>
      <div class="tile"><span class="tile-label">Aufgaben</span><span class="tile-value">${all.done} / ${all.total}</span><span class="tile-sub">erledigt</span></div>
      <div class="tile tile-progress"><span class="tile-label">Fortschritt</span><span class="tile-value">${Math.round(prog.frac * 100)} %</span><span class="meter meter-pc" style="--pc: var(--pc-${p.color || 1})"><i style="width:${(prog.frac * 100).toFixed(1)}%"></i></span><span class="tile-sub">${U.esc(prog.label)}</span></div>
    </div>
    <div class="two-col">
      <section class="card">
        <div class="card-head"><h2>Offene Aufgaben</h2><span class="muted">${open.length}</span></div>
        ${open.length ? `<ul class="task-list">${open.map((t) => UI.taskRow(t, { showProject: false })).join('')}</ul>` : '<p class="empty-line">Keine offenen Aufgaben.</p>'}
        <form class="quick-add" data-form="projectTask" autocomplete="off">
          <input type="hidden" name="projectId" value="${p.id}">
          <label class="sr-only" for="ptTitle">Neue Aufgabe in diesem Projekt</label>
          <input id="ptTitle" name="title" data-keep placeholder="Neue Aufgabe …" required maxlength="140">
          <label class="sr-only" for="ptDate">Datum</label>
          <input id="ptDate" name="date" type="date" data-keep title="Geplant am">
          <label class="sr-only" for="ptEst">Pomodoros</label>
          <input id="ptEst" name="estimate" data-keep type="number" min="1" max="20" value="1" inputmode="numeric" title="Geschätzte Pomodoros">
          <button type="submit" class="icon-btn icon-btn-solid" aria-label="Hinzufügen">${UI.icon('plus')}</button>
        </form>
        ${done.length ? `<details class="done-list"><summary>Erledigt (${done.length})</summary><ul class="task-list">${done.map((t) => UI.taskRow(t, { showProject: false })).join('')}</ul></details>` : ''}
      </section>
      <section class="card">
        <div class="card-head"><h2>Letzte 14 Tage</h2><span class="muted">${U.fmtDur(U.sum(days, (d) => d.sec))}</span></div>
        ${chart}
        <h3 class="mini-title">Letzte Einträge</h3>
        ${sessions.length ? `<ul class="log-list">${sessions.slice(0, 8).map((s) => `<li><button type="button" class="log-item" data-act="editSession" data-id="${s.id}">
          <span class="mono">${U.fmtDay(s.start)} ${U.fmtTime(s.start)}</span><span class="log-title">${U.esc(Store.sessionLabel(s))}</span><span class="mono">${U.fmtDur(s.sec)}</span></button></li>`).join('')}</ul>`
          : '<p class="empty-line">Noch keine Zeit erfasst.</p>'}
      </section>
    </div>`;
  },
};

function progressOf(p, stats) {
  if (p.goalHours) {
    const goal = p.goalHours * 3600;
    return { frac: U.clamp(stats.sec / goal, 0, 1), label: `${U.fmtHM(stats.sec)} von ${p.goalHours} h Zielzeit` };
  }
  if (stats.total) return { frac: stats.done / stats.total, label: `${stats.done} von ${stats.total} Aufgaben erledigt` };
  return { frac: 0, label: 'Noch keine Aufgaben' };
}

function deadlineBadge(p) {
  if (!p.deadline) return '';
  const d = U.daysBetween(new Date(), U.parseKey(p.deadline));
  const txt = d > 1 ? `noch ${d} Tage` : d === 1 ? 'morgen fällig' : d === 0 ? 'heute fällig' : `seit ${-d} Tag${d === -1 ? '' : 'en'} vorbei`;
  const cls = d < 0 ? ' is-late' : d <= 7 ? ' is-soon' : '';
  return `<span class="badge${cls}" title="Termin ${U.fmtDate(p.deadline)}">${UI.icon('flag')}${txt}</span>`;
}

function openProjectDialog(project) {
  const p = project ? U.clone(project) : { id: U.uid('p'), name: '', category: 'lernen', color: (Store.state.projects.length % 8) + 1, goalHours: null, deadline: null, notes: '', archived: false };
  UI.form({
    title: project ? 'Projekt bearbeiten' : 'Neues Projekt',
    submitLabel: project ? 'Speichern' : 'Anlegen',
    body: `
      <div class="field"><label for="pdName">Name</label><input id="pdName" name="name" required maxlength="80" value="${U.esc(p.name)}" placeholder="z. B. Signalverarbeitung" autofocus></div>
      <fieldset class="field"><legend>Kategorie</legend><div class="seg seg-radio">
        ${CAT_KEYS.map((c) => `<label class="seg-btn"><input type="radio" name="category" value="${c}"${p.category === c ? ' checked' : ''}><span>${CATS[c].label}</span></label>`).join('')}
      </div></fieldset>
      <fieldset class="field"><legend>Farbe</legend><div class="swatches">
        ${PROJECT_COLORS.map((name, i) => `<label class="swatch" style="--pc: var(--pc-${i + 1})" title="${name}"><input type="radio" name="color" value="${i + 1}"${+p.color === i + 1 ? ' checked' : ''}><span class="sr-only">${name}</span></label>`).join('')}
      </div></fieldset>
      <div class="field-row">
        <div class="field"><label for="pdGoal">Zielzeit (Stunden, optional)</label><input id="pdGoal" name="goalHours" type="number" min="0" max="5000" step="0.5" inputmode="decimal" value="${p.goalHours ?? ''}" placeholder="z. B. 60"></div>
        <div class="field"><label for="pdDeadline">Termin (optional)</label><input id="pdDeadline" name="deadline" type="date" value="${p.deadline || ''}"></div>
      </div>
      <div class="field"><label for="pdNotes">Notizen</label><textarea id="pdNotes" name="notes" rows="2" maxlength="2000">${U.esc(p.notes || '')}</textarea></div>
      ${project ? `<label class="switch"><input type="checkbox" name="archived"${p.archived ? ' checked' : ''}><span>Archiviert (aus Listen ausblenden)</span></label>` : ''}`,
    extraFooter: project ? `<button type="button" class="btn btn-ghost btn-danger-text" data-act="deleteProject" data-id="${p.id}">${UI.icon('trash')}Löschen</button>` : '',
    onSubmit(fd) {
      p.name = String(fd.get('name') || '').trim();
      if (!p.name) return false;
      p.category = CATS[fd.get('category')] ? fd.get('category') : 'sonstiges';
      p.color = U.clamp(parseInt(fd.get('color'), 10) || 1, 1, 8);
      const g = parseFloat(fd.get('goalHours'));
      p.goalHours = g > 0 ? g : null;
      p.deadline = fd.get('deadline') || null;
      p.notes = String(fd.get('notes') || '');
      if (project) p.archived = fd.get('archived') === 'on';
      Store.saveProject(p);
      if (!project) { App.ui.projectId = p.id; App.saveUi(); UI.toast('Projekt angelegt'); }
      return true;
    },
  });
}

/* js/views/kalender.js */
/* Ansicht «Kalender»: Wochen- und Monatsplanung mit Drag & Drop */
'use strict';

Views.kalender = {
  title: 'Kalender',
  render() {
    const cal = App.ui.cal;
    const a = U.parseKey(cal.anchor);
    const seg = (v, t) => `<button type="button" class="seg-btn${cal.mode === v ? ' is-on' : ''}" aria-pressed="${cal.mode === v}" data-act="calMode" data-v="${v}">${t}</button>`;
    let title; let eyebrow;
    if (cal.mode === 'week') {
      const w0 = U.startOfWeek(a); const w6 = U.addDays(w0, 6);
      eyebrow = `KW ${U.isoWeek(w0)}`;
      title = w0.getMonth() === w6.getMonth()
        ? `${w0.getDate()}.–${w6.getDate()}. ${U.MONTHS[w6.getMonth()]} ${w6.getFullYear()}`
        : `${w0.getDate()}. ${U.MONTHS_SHORT[w0.getMonth()]} – ${w6.getDate()}. ${U.MONTHS_SHORT[w6.getMonth()]} ${w6.getFullYear()}`;
    } else {
      eyebrow = 'Monat';
      title = `${U.MONTHS[a.getMonth()]} ${a.getFullYear()}`;
    }
    return `
    <div class="view-head">
      <div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1></div>
      <div class="head-actions">
        <div class="seg" role="group" aria-label="Ansicht">${seg('week', 'Woche')}${seg('month', 'Monat')}</div>
        <div class="pager">
          <button type="button" class="icon-btn" data-act="calNav" data-d="-1" aria-label="Zurück">${UI.icon('chevron-left')}</button>
          <button type="button" class="btn btn-ghost" data-act="calToday">Heute</button>
          <button type="button" class="icon-btn" data-act="calNav" data-d="1" aria-label="Weiter">${UI.icon('chevron-right')}</button>
        </div>
      </div>
    </div>
    <p class="hint muted">${U.isTouch ? 'Tippe auf eine Aufgabe zum Bearbeiten, verschiebe sie mit ‹ ›.' : 'Ziehe Aufgaben auf einen Tag, um sie zu planen. Klicke auf einen Tag für Details.'}</p>
    ${cal.mode === 'week' ? this.week(a) : this.month(a)}`;
  },

  dayInfo(from, days) {
    const info = new Map();
    for (let i = 0; i < days; i++) {
      const k = U.dateKey(U.addDays(from, i));
      info.set(k, { tasks: [], sec: 0, deadlines: [] });
    }
    Store.state.tasks.forEach((t) => { if (t.date && info.has(t.date)) info.get(t.date).tasks.push(t); });
    const end = U.addDays(from, days);
    Store.sessionsBetween(from, end).forEach((s) => { const k = U.dateKey(s.start); if (info.has(k)) info.get(k).sec += s.sec; });
    Store.projects().forEach((p) => { if (p.deadline && info.has(p.deadline)) info.get(p.deadline).deadlines.push(p); });
    info.forEach((v) => v.tasks.sort(taskSort));
    return info;
  },

  week(a) {
    const w0 = U.startOfWeek(a);
    const info = this.dayInfo(w0, 7);
    const today = U.todayKey();
    const cap = Store.settings.capacity || 8;
    const cols = [...info.entries()].map(([k, d], i) => {
      const load = U.sum(d.tasks.filter((t) => !t.done), (t) => t.estimate || 1);
      const over = load > cap;
      const dt = U.parseKey(k);
      return `<div class="wk-col${k === today ? ' is-today' : ''}${k < today ? ' is-past' : ''}" data-drop="${k}">
        <div class="wk-head">
          <span class="wk-day"><span class="wk-wd">${U.WD[i]}</span><span class="wk-date">${dt.getDate()}.${dt.getMonth() + 1}.</span></span>
          <span class="wk-load${over ? ' is-over' : ''}" title="${load} von ${cap} Pomodoros geplant">${load}/${cap}</span>
        </div>
        <div class="meter meter-load${over ? ' is-over' : ''}"><i style="width:${U.clamp((load / cap) * 100, 0, 100).toFixed(1)}%"></i></div>
        ${d.deadlines.map((p) => `<div class="cal-deadline" style="--pc: var(--pc-${p.color || 1})">${UI.icon('flag')}${U.esc(p.name)}</div>`).join('')}
        <ul class="wk-list">${d.tasks.map((t) => this.card(t)).join('')}</ul>
        <button type="button" class="wk-add" data-act="addTaskOn" data-date="${k}">${UI.icon('plus')}Aufgabe</button>
        <div class="wk-foot">${d.sec ? `${UI.icon('timer')}<span class="mono">${U.fmtHM(d.sec)}</span> erfasst` : ''}</div>
      </div>`;
    }).join('');
    const backlog = Store.state.tasks.filter((t) => !t.done && (!t.date || t.date < today))
      .sort((x, y) => (x.date ? 0 : 1) - (y.date ? 0 : 1) || taskSort(x, y));
    return `<div class="week-layout">
      <aside class="card backlog" data-drop="none">
        <div class="card-head"><h2>Ungeplant</h2><span class="muted">${backlog.length}</span></div>
        <p class="muted small">Offene Aufgaben ohne Datum oder überfällig. Hierher ziehen entfernt das Datum.</p>
        ${backlog.length ? `<ul class="wk-list">${backlog.map((t) => this.card(t, true)).join('')}</ul>` : '<p class="empty-line">Alles eingeplant.</p>'}
        <button type="button" class="wk-add" data-act="addTaskOn" data-date="">${UI.icon('plus')}Aufgabe</button>
      </aside>
      <div class="week-grid">${cols}</div>
    </div>`;
  },

  card(t, inBacklog = false) {
    const p = Store.project(t.projectId);
    const st = Store.taskStats(t.id);
    const overdue = !t.done && t.date && t.date < U.todayKey();
    return `<li class="wk-card${t.done ? ' is-done' : ''}" draggable="true" data-task="${t.id}" style="--pc: var(--pc-${p ? p.color || 1 : 0})">
      <button type="button" class="wk-card-main" data-act="editTask" data-id="${t.id}">
        ${t.time ? `<span class="wk-time mono">${t.time}</span>` : ''}
        <span class="wk-title">${U.esc(t.title)}</span>
        <span class="wk-meta">${p ? U.esc(p.name) : 'Ohne Projekt'}${inBacklog && overdue ? ` · <span class="is-overdue">${U.fmtDay(t.date)}</span>` : ''}</span>
        ${UI.pomoDots(st.pomos, t.estimate || 1)}
      </button>
      ${inBacklog ? `<button type="button" class="icon-btn sm" data-act="planToday" data-id="${t.id}" title="Für heute planen" aria-label="Für heute planen">${UI.icon('calendar')}</button>` : `
      <span class="wk-move">
        <button type="button" class="icon-btn sm" data-act="shiftTask" data-id="${t.id}" data-d="-1" title="Einen Tag früher" aria-label="Einen Tag früher">${UI.icon('chevron-left')}</button>
        <button type="button" class="icon-btn sm" data-act="shiftTask" data-id="${t.id}" data-d="1" title="Einen Tag später" aria-label="Einen Tag später">${UI.icon('chevron-right')}</button>
      </span>`}
    </li>`;
  },

  month(a) {
    const m0 = U.startOfMonth(a);
    const m1 = U.addMonths(m0, 1);
    const g0 = U.startOfWeek(m0);
    const weeks = Math.ceil(U.daysBetween(g0, m1) / 7);
    const info = this.dayInfo(g0, weeks * 7);
    const today = U.todayKey();
    const sel = App.ui.cal.selected;
    const cap = Store.settings.capacity || 8;
    let rows = '';
    for (let w = 0; w < weeks; w++) {
      const ws = U.addDays(g0, w * 7);
      let cells = `<div class="kw" aria-hidden="true">${U.isoWeek(ws)}</div>`;
      for (let i = 0; i < 7; i++) {
        const dt = U.addDays(ws, i);
        const k = U.dateKey(dt);
        const d = info.get(k);
        const load = U.sum(d.tasks.filter((t) => !t.done), (t) => t.estimate || 1);
        const out = dt.getMonth() !== m0.getMonth();
        const chips = d.tasks.slice(0, 3).map((t) => {
          const p = Store.project(t.projectId);
          return `<button type="button" class="cal-chip${t.done ? ' is-done' : ''}" draggable="true" data-task="${t.id}" data-act="editTask" data-id="${t.id}" style="--pc: var(--pc-${p ? p.color || 1 : 0})">${U.esc(t.title)}</button>`;
        }).join('');
        const dots = d.tasks.slice(0, 5).map((t) => { const p = Store.project(t.projectId); return `<i class="${t.done ? 'is-done' : ''}" style="--pc: var(--pc-${p ? p.color || 1 : 0})"></i>`; }).join('');
        cells += `<div class="cal-cell${out ? ' is-out' : ''}${k === today ? ' is-today' : ''}${k === sel ? ' is-sel' : ''}" data-drop="${k}" data-act="calSelect" data-date="${k}">
          <div class="cal-top">
            <button type="button" class="cal-num" data-act="calSelect" data-date="${k}" aria-label="${U.fmtDayLong(k)}${d.tasks.length ? `, ${d.tasks.length} Aufgaben` : ''}">${dt.getDate()}</button>
            ${d.sec ? `<span class="cal-logged mono" title="erfasst">${U.fmtHM(d.sec)}</span>` : ''}
          </div>
          ${d.deadlines.map((p) => `<div class="cal-deadline" style="--pc: var(--pc-${p.color || 1})" title="Termin: ${U.esc(p.name)}">${UI.icon('flag')}<span>${U.esc(p.name)}</span></div>`).join('')}
          <div class="cal-items">${chips}${d.tasks.length > 3 ? `<span class="cal-more">+${d.tasks.length - 3}</span>` : ''}</div>
          <div class="cal-dots" aria-hidden="true">${dots}</div>
          ${load ? `<div class="meter meter-load meter-thin${load > cap ? ' is-over' : ''}" title="${load} von ${cap} Pomodoros geplant"><i style="width:${U.clamp((load / cap) * 100, 0, 100).toFixed(1)}%"></i></div>` : ''}
        </div>`;
      }
      rows += cells;
    }
    return `<div class="month-layout">
      <div class="card month-card">
        <div class="month-grid month-head"><div class="kw">KW</div>${U.WD.map((d) => `<div>${d}</div>`).join('')}</div>
        <div class="month-grid">${rows}</div>
      </div>
      ${this.dayPanel(sel)}
    </div>`;
  },

  dayPanel(k) {
    const tasks = Store.tasksOn(k);
    const d0 = U.parseKey(k);
    const sessions = Store.sessionsBetween(d0, U.addDays(d0, 1)).sort((a, b) => a.start - b.start);
    const cap = Store.settings.capacity || 8;
    const load = U.sum(tasks.filter((t) => !t.done), (t) => t.estimate || 1);
    const deadlines = Store.projects().filter((p) => p.deadline === k);
    return `<aside class="card day-panel">
      <div class="card-head"><h2>${U.fmtDayLong(k)}</h2></div>
      <p class="muted small">${load} von ${cap} Pomodoros geplant${sessions.length ? ` · ${U.fmtDur(U.sum(sessions, (s) => s.sec))} erfasst` : ''}</p>
      ${deadlines.map((p) => `<div class="cal-deadline" style="--pc: var(--pc-${p.color || 1})">${UI.icon('flag')}Termin: ${U.esc(p.name)}</div>`).join('')}
      ${tasks.length ? `<ul class="task-list">${tasks.map((t) => UI.taskRow(t, { showDate: false, draggable: !U.isTouch })).join('')}</ul>` : '<p class="empty-line">Keine Aufgaben geplant.</p>'}
      <form class="quick-add" data-form="dayTask" autocomplete="off">
        <input type="hidden" name="date" value="${k}">
        <label class="sr-only" for="dtTitle">Neue Aufgabe an diesem Tag</label>
        <input id="dtTitle" name="title" data-keep placeholder="Aufgabe für diesen Tag …" required maxlength="140">
        <label class="sr-only" for="dtProject">Projekt</label>
        <select id="dtProject" name="projectId" data-keep>${UI.projectOptions(App.ui.lastProject || '')}</select>
        <label class="sr-only" for="dtEst">Pomodoros</label>
        <input id="dtEst" name="estimate" data-keep type="number" min="1" max="20" value="1" inputmode="numeric" title="Geschätzte Pomodoros">
        <button type="submit" class="icon-btn icon-btn-solid" aria-label="Hinzufügen">${UI.icon('plus')}</button>
      </form>
      ${sessions.length ? `<h3 class="mini-title">Erfasste Zeit</h3><ul class="log-list">${sessions.map((s) => `<li><button type="button" class="log-item" data-act="editSession" data-id="${s.id}">
        <span class="mono">${U.fmtTime(s.start)}–${U.fmtTime(s.end)}</span><span class="log-title">${U.esc(Store.sessionLabel(s))}</span><span class="mono">${U.fmtDur(s.sec)}</span></button></li>`).join('')}</ul>` : ''}
    </aside>`;
  },
};

/* js/views/auswertung.js */
/* Ansicht «Auswertung»: Lern- und Arbeitszeit nach Zeitraum, Projekten,
 * Zusammenfassung als Text, Protokoll mit Nachtragen und CSV-Export */
'use strict';

const CAT_SERIES = CAT_KEYS.map((c) => ({ key: c, label: CATS[c].label, color: `var(--cat-${c})` }));

function statsRange(range, anchorKey) {
  const a = U.parseKey(anchorKey);
  if (range === 'day') {
    const s = U.startOfDay(a);
    return { start: s, end: U.addDays(s, 1), label: U.fmtDayLong(s), prevLabel: 'Vortag', unit: 'hour' };
  }
  if (range === 'month') {
    const s = U.startOfMonth(a);
    return { start: s, end: U.addMonths(s, 1), label: `${U.MONTHS[s.getMonth()]} ${s.getFullYear()}`, prevLabel: 'Vormonat', unit: 'day' };
  }
  if (range === 'year') {
    const s = U.startOfYear(a);
    return { start: s, end: new Date(s.getFullYear() + 1, 0, 1), label: String(s.getFullYear()), prevLabel: 'Vorjahr', unit: 'month' };
  }
  const s = U.startOfWeek(a);
  const e = U.addDays(s, 7);
  return { start: s, end: e, label: `KW ${U.isoWeek(s)} · ${U.fmtDate(s).slice(0, 6)}–${U.fmtDate(U.addDays(s, 6))}`, prevLabel: 'Vorwoche', unit: 'day' };
}

function shiftAnchor(range, key, d) {
  const a = U.parseKey(key);
  if (range === 'day') return U.dateKey(U.addDays(a, d));
  if (range === 'week') return U.dateKey(U.addDays(a, 7 * d));
  if (range === 'month') return U.dateKey(U.addMonths(a, d));
  return U.dateKey(new Date(a.getFullYear() + d, 0, 1));
}

function summarize(range, anchorKey) {
  const R = statsRange(range, anchorKey);
  const sessions = Store.sessionsBetween(R.start, R.end);
  const prevStart = U.parseKey(shiftAnchor(range, anchorKey, -1));
  const PR = statsRange(range, U.dateKey(prevStart));
  const prevSec = U.sum(Store.sessionsBetween(PR.start, PR.end), (s) => s.sec);
  const total = U.sum(sessions, (s) => s.sec);
  const byCat = Object.fromEntries(CAT_KEYS.map((c) => [c, 0]));
  const byProject = new Map();
  sessions.forEach((s) => {
    const c = Store.sessionCat(s);
    byCat[c] += s.sec;
    const p = Store.sessionProject(s);
    const k = p ? p.id : `~${c}`;
    if (!byProject.has(k)) byProject.set(k, { project: p, cat: c, sec: 0, pomos: 0 });
    const e = byProject.get(k); e.sec += s.sec; if (s.full) e.pomos++;
  });
  const days = new Set(sessions.map((s) => U.dateKey(s.start)));
  const doneTasks = Store.state.tasks.filter((t) => t.done && t.doneAt >= +R.start && t.doneAt < +R.end);
  // Säulen
  const buckets = [];
  if (R.unit === 'hour') {
    for (let h = 0; h < 24; h++) buckets.push({ label: h % 3 === 0 ? String(h) : '', sub: `${U.pad2(h)}:00–${U.pad2(h + 1)}:00`, values: {} });
    sessions.forEach((s) => {
      // auf Stunden verteilen
      let t = s.start;
      const end = s.start + s.sec * 1000;
      while (t < end) {
        const d = new Date(t);
        const next = new Date(d); next.setMinutes(60, 0, 0);
        const part = (Math.min(end, +next) - t) / 1000;
        if (d >= R.start && d < R.end) {
          const b = buckets[d.getHours()];
          const c = Store.sessionCat(s);
          b.values[c] = (b.values[c] || 0) + part;
        }
        t = +next;
      }
    });
  } else if (R.unit === 'day') {
    const n = U.daysBetween(R.start, R.end);
    for (let i = 0; i < n; i++) {
      const d = U.addDays(R.start, i);
      const dn = d.getDate();
      buckets.push({ label: range === 'week' ? U.WD[i] : (dn === 1 || dn % 5 === 0 ? String(dn) : ''), sub: U.fmtDayLong(d), values: {}, key: U.dateKey(d) });
    }
    sessions.forEach((s) => {
      const i = U.daysBetween(R.start, new Date(s.start));
      const c = Store.sessionCat(s);
      if (buckets[i]) buckets[i].values[c] = (buckets[i].values[c] || 0) + s.sec;
    });
  } else {
    const MS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
    for (let m = 0; m < 12; m++) buckets.push({ label: MS[m], sub: `${U.MONTHS[m]} ${R.start.getFullYear()}`, values: {} });
    sessions.forEach((s) => {
      const m = new Date(s.start).getMonth();
      const c = Store.sessionCat(s);
      buckets[m].values[c] = (buckets[m].values[c] || 0) + s.sec;
    });
  }
  return { R, PR, sessions, total, prevSec, byCat, byProject: [...byProject.values()].sort((a, b) => b.sec - a.sec), days, doneTasks, buckets, pomos: sessions.filter((s) => s.full).length };
}

function summaryText(sum) {
  const lines = [];
  lines.push(`Auswertung ${sum.R.label}`);
  lines.push(`Fokuszeit total: ${U.fmtDur(sum.total)} · ${sum.pomos} Pomodoros · ${sum.days.size} aktive${sum.days.size === 1 ? 'r' : ''} Tag${sum.days.size === 1 ? '' : 'e'}`);
  CAT_KEYS.forEach((c) => {
    const v = sum.byCat[c];
    if (!v) return;
    lines.push('');
    lines.push(`${CATS[c].label}: ${U.fmtDur(v)} (${U.pct(v, sum.total)} %)`);
    sum.byProject.filter((e) => e.cat === c).forEach((e) => {
      lines.push(`  – ${e.project ? e.project.name : 'Ohne Projekt'}: ${U.fmtDur(e.sec)}`);
    });
  });
  if (sum.doneTasks.length) {
    lines.push('');
    lines.push(`Erledigte Aufgaben (${sum.doneTasks.length}):`);
    sum.doneTasks.forEach((t) => { const p = Store.project(t.projectId); lines.push(`  ✓ ${t.title}${p ? ` (${p.name})` : ''}`); });
  }
  return lines.join('\n');
}

/** Dialog: Zeit nachtragen / Eintrag bearbeiten */
function openSessionDialog(session) {
  const s = session ? U.clone(session) : null;
  const now = new Date();
  const start = s ? new Date(s.start) : new Date(now.getTime() - 25 * 60000);
  const target = s ? (s.taskId && Store.task(s.taskId) ? `t:${s.taskId}` : s.projectId && Store.project(s.projectId) ? `p:${s.projectId}` : `c:${Store.sessionCat(s)}`) : Store.state.timer.target;
  UI.form({
    title: s ? 'Eintrag bearbeiten' : 'Zeit nachtragen',
    submitLabel: s ? 'Speichern' : 'Eintragen',
    body: `
      <div class="field-row">
        <div class="field"><label for="sdDate">Datum</label><input id="sdDate" name="date" type="date" required value="${U.dateKey(start)}"></div>
        <div class="field field-s"><label for="sdStart">Beginn</label><input id="sdStart" name="start" type="time" required value="${U.fmtTime(start)}"></div>
        <div class="field field-s"><label for="sdDur">Minuten</label><input id="sdDur" name="minutes" type="number" min="1" max="1440" required inputmode="numeric" value="${s ? Math.round(s.sec / 60) : 25}"></div>
      </div>
      <div class="field"><label for="sdTarget">Zuordnung</label><select id="sdTarget" name="target">${UI.targetOptions(target)}</select></div>
      <div class="field"><label for="sdNote">Notiz</label><input id="sdNote" name="note" maxlength="300" value="${U.esc(s ? s.note || '' : '')}" placeholder="z. B. Vorlesung, Gruppenarbeit"></div>
      <label class="switch"><input type="checkbox" name="full"${!s || s.full ? '' : ''}${s && s.full ? ' checked' : ''}><span>Als Pomodoro zählen</span></label>`,
    extraFooter: s ? `<button type="button" class="btn btn-ghost btn-danger-text" data-act="deleteSession" data-id="${s.id}">${UI.icon('trash')}Löschen</button>` : '',
    onSubmit(fd) {
      const startMs = U.atTime(fd.get('date'), fd.get('start'));
      const sec = U.clamp(parseInt(fd.get('minutes'), 10) || 0, 1, 1440) * 60;
      const tg = Store.resolveTarget(fd.get('target'));
      const rec = s || { id: U.uid('s'), manual: true };
      const prevStart = s ? s.start : null;
      Object.assign(rec, {
        start: startMs, end: startMs + sec * 1000, sec, full: fd.get('full') === 'on',
        taskId: tg.taskId, projectId: tg.projectId, category: tg.category,
        title: tg.taskId || tg.projectId ? tg.title : '', note: String(fd.get('note') || '').trim(),
      });
      Store.saveSession(rec, prevStart);
      UI.toast(s ? 'Eintrag gespeichert' : `${U.fmtDur(sec)} nachgetragen`);
      return true;
    },
  });
}

function sessionsCsv(sessions) {
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['Datum', 'Beginn', 'Ende', 'Minuten', 'Kategorie', 'Projekt', 'Aufgabe', 'Pomodoro', 'Nachgetragen', 'Notiz'];
  const rows = sessions.slice().sort((a, b) => a.start - b.start).map((s) => {
    const p = Store.sessionProject(s);
    const t = Store.task(s.taskId);
    return [U.fmtDate(s.start), U.fmtTime(s.start), U.fmtTime(s.end), (s.sec / 60).toFixed(1), CATS[Store.sessionCat(s)].label,
      p ? p.name : '', t ? t.title : (s.title && !p ? s.title : (s.title && p && s.title !== p.name ? s.title : '')), s.full ? 'ja' : 'nein', s.manual ? 'ja' : 'nein', s.note || ''].map(q).join(';');
  });
  return `﻿${[head.map(q).join(';'), ...rows].join('\r\n')}`;
}

/* js/app.js */
/* App: Navigation, Rendering, Aktionen, Tastatur, Drag & Drop,
 * Minimieren (Mini-Fenster), Darstellung, Installation und Start */
'use strict';

const VIEW_ORDER = ['fokus', 'aufgaben', 'projekte', 'kalender', 'auswertung', 'einstellungen'];
const UI_KEY = 'pomodoro-planer.ui';

const App = {
  view: 'fokus',
  ui: null,
  connecting: false,
  installPrompt: null,
  flashMood: null,
  pip: null,
  _lastView: null,
  _title: '',

  defaults() {
    const k = U.todayKey();
    return {
      view: 'fokus', mode: 'auto', skin: 'klassisch', mini: false,
      taskFilter: { status: 'open', project: 'all', when: 'all', q: '' },
      cal: { mode: 'week', anchor: k, selected: k },
      stats: { range: 'week', anchor: k },
      projectId: null, showArchived: false, lastProject: '', logLimit: 50,
    };
  },
  loadUi() {
    const d = this.defaults();
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(UI_KEY) || '{}') || {}; } catch { saved = {}; }
    this.ui = {
      ...d, ...saved,
      taskFilter: { ...d.taskFilter, ...(saved.taskFilter || {}) },
      cal: { ...d.cal, mode: saved.cal?.mode === 'month' ? 'month' : 'week' },
      stats: { ...d.stats, range: ['day', 'week', 'month', 'year'].includes(saved.stats?.range) ? saved.stats.range : 'week' },
      logLimit: 50,
    };
  },
  saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify(this.ui)); } catch { /* privat/blockiert */ } },
  pipOpen() { return !!this.pip; },

  /* ---------- Darstellung ---------- */
  isDark() {
    const r = document.documentElement;
    if (this.ui.mode === 'nacht') return true;
    if (this.ui.mode === 'tag') return false;
    if (r.dataset.theme === 'dark') return true;
    if (r.dataset.theme === 'light') return false;
    return matchMedia('(prefers-color-scheme: dark)').matches;
  },
  applyTheme() {
    const r = document.documentElement;
    if (this.ui.mode === 'auto') delete r.dataset.mode; else r.dataset.mode = this.ui.mode;
    if (this.ui.skin === 'anime') { r.dataset.skin = 'anime'; loadAnimeFonts(); } else delete r.dataset.skin;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = getComputedStyle(r).getPropertyValue('--bg').trim() || (this.isDark() ? '#0e1315' : '#eef2f1');
    if (this.pip) syncPipTheme();
  },

  /* ---------- Navigation & Rendering ---------- */
  go(v, { keepProject = false } = {}) {
    if (!Views[v]) v = 'fokus';
    if (v === 'projekte' && !keepProject && this.view !== 'projekte') this.ui.projectId = null;
    this.view = v; this.ui.view = v;
    this.saveUi();
    try { history.replaceState(null, '', `#${v}`); } catch { /* egal */ }
    this.render();
    window.scrollTo(0, 0);
  },

  render() {
    const main = document.getElementById('main');
    const same = this._lastView === this.view;
    const keep = {};
    if (same) main.querySelectorAll('[data-keep]').forEach((el) => { if (el.id) keep[el.id] = el.value; });
    const ae = document.activeElement;
    const focusId = same && ae && main.contains(ae) ? ae.id : null;
    let sel = null;
    try { if (focusId && typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch { sel = null; }
    UI.hideTip();
    main.innerHTML = Views[this.view].render();
    main.dataset.view = this.view;
    Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el && el.matches('[data-keep]')) el.value = v; });
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch { /* Typ ohne Auswahl */ } } }
    }
    this._lastView = this.view;
    this.renderChrome();
    this.renderMini();
    this.onTick();
  },

  renderChrome() {
    document.querySelectorAll('[data-nav]').forEach((el) => {
      const on = el.dataset.nav === this.view;
      el.classList.toggle('is-on', on);
      if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
    });
    const x = Store.state.timer;
    const running = x.status === 'running';
    const active = x.status !== 'idle';
    const mt = `<span class="mt-dot" aria-hidden="true"></span>
      <button type="button" class="mt-clock" data-act="go" data-view="fokus" title="Zum Timer"><span class="mt-phase">${PHASES[x.phase].short}</span><span class="mono" data-clock>${U.fmtClock(Timer.remaining())}</span></button>
      <button type="button" class="icon-btn sm" data-act="toggle" aria-label="${running ? 'Pause' : 'Start'} (Leertaste)" title="${running ? 'Pause' : 'Start'} (Leertaste)">${UI.icon(running ? 'pause' : 'play')}</button>
      <button type="button" class="icon-btn sm" data-act="minimize" aria-label="Minimieren (M)" title="Minimieren (M)">${UI.icon('minimize')}</button>`;
    document.querySelectorAll('[data-mini-timer]').forEach((el) => {
      el.innerHTML = mt;
      el.dataset.phase = x.phase;
      el.classList.toggle('is-active', active);
      el.classList.toggle('is-running', running);
    });
    const dark = this.isDark();
    document.querySelectorAll('[data-theme-btn]').forEach((el) => {
      el.innerHTML = UI.icon(dark ? 'sun' : 'moon');
      el.setAttribute('aria-label', dark ? 'Tagmodus' : 'Nachtmodus');
      el.title = `${dark ? 'Tagmodus' : 'Nachtmodus'} (T)`;
    });
    document.querySelectorAll('[data-install]').forEach((el) => { el.hidden = !this.installPrompt; });
    const app = document.getElementById('app');
    app.classList.toggle('is-connecting', this.connecting);
    app.dataset.view = this.view;
    document.body.classList.toggle('is-mini', !!this.ui.mini);
    this.renderSaveState();
  },

  renderSaveState() {
    const claude = Store.backend.name === 'claude';
    const txt = Store.saveStatus === 'saving' ? 'Speichert …'
      : Store.saveStatus === 'error' ? 'Nicht gespeichert'
        : claude ? 'Im Konto gespeichert' : 'Lokal gespeichert';
    document.querySelectorAll('[data-save-state]').forEach((el) => {
      el.textContent = txt;
      el.dataset.state = Store.saveStatus;
      el.title = Store.saveError || (claude ? 'Synchronisiert über dein Claude-Konto' : 'Gespeichert in diesem Browser');
    });
  },

  renderMini() {
    const root = document.getElementById('miniRoot');
    if (this.ui.mini) { root.innerHTML = miniHTML(); root.hidden = false; } else { root.hidden = true; root.innerHTML = ''; }
    if (this.pip) this.pip.document.getElementById('pipRoot').innerHTML = miniHTML(true);
  },

  onTick() {
    const x = Store.state.timer;
    const rem = Timer.remaining();
    const dur = Timer.duration();
    const txt = U.fmtClock(rem);
    const docs = this.pip ? [document, this.pip.document] : [document];
    docs.forEach((d) => {
      d.querySelectorAll('[data-clock]').forEach((el) => { if (el.textContent !== txt) el.textContent = txt; });
      d.querySelectorAll('[data-bar]').forEach((el) => { el.style.width = `${(U.clamp(1 - rem / dur, 0, 1) * 100).toFixed(2)}%`; });
    });
    if (this.view === 'fokus') UI.updateDial(document, dur ? rem / dur : 1);
    const title = x.status === 'idle' ? 'Pomodoro-Planer' : `${txt} · ${x.status === 'paused' ? 'Pausiert' : PHASES[x.phase].short} – Pomodoro-Planer`;
    if (title !== this._title) { document.title = title; this._title = title; }
  },

  onPhaseComplete(phase, next, session, msg) {
    UI.toast(msg, { timeout: 7000 });
    if (phase === 'focus' && session) {
      this.flashMood = 'yay';
      setTimeout(() => { this.flashMood = null; if (this.view === 'fokus') this.render(); }, 8000);
    }
  },
};

/* ---------- Mini-Ansicht (in der App und im schwebenden Fenster) ---------- */
function miniHTML() {
  const x = Store.state.timer;
  const tg = Store.resolveTarget(x.target);
  const running = x.status === 'running';
  const active = x.status !== 'idle';
  const anime = document.documentElement.dataset.skin === 'anime';
  const mood = running ? (x.phase === 'focus' ? 'focus' : 'break') : active ? 'paused' : (App.flashMood || 'idle');
  const second = x.phase === 'focus'
    ? (active ? `<button type="button" class="icon-btn" data-act="finish" title="Fertig &amp; speichern (F)" aria-label="Fertig und speichern">${UI.icon('check')}</button>` : '')
    : `<button type="button" class="icon-btn" data-act="skip" title="Pause überspringen (S)" aria-label="Pause überspringen">${UI.icon('skip')}</button>`;
  return `<div class="mini" data-phase="${x.phase}">
    <div class="mini-head"><span class="mini-phase"><i></i>${PHASES[x.phase].label}${x.status === 'paused' ? ' · pausiert' : ''}</span>
      <button type="button" class="icon-btn sm" data-act="miniClose" title="Grosse Ansicht" aria-label="Grosse Ansicht">${UI.icon('expand')}</button></div>
    <div class="mini-body">${anime ? `<div class="mini-mascot">${UI.mascot(mood)}</div>` : ''}
      <div class="mini-clock mono" data-clock>${U.fmtClock(Timer.remaining())}</div></div>
    <div class="mini-bar"><i data-bar></i></div>
    <div class="mini-task">${U.esc(tg.title)}</div>
    <div class="mini-ctrl">
      <button type="button" class="btn-start btn-start-sm" data-act="toggle">${UI.icon(running ? 'pause' : 'play')}<span>${running ? 'Pause' : active ? 'Weiter' : 'Start'}</span></button>
      ${second}
    </div>
    <p class="mini-hint"><kbd>Leertaste</kbd> Start/Pause</p>
  </div>`;
}

async function openPip() {
  if (!('documentPictureInPicture' in window)) return false;
  try {
    const pip = await window.documentPictureInPicture.requestWindow({ width: 320, height: document.documentElement.dataset.skin === 'anime' ? 300 : 250 });
    [...document.styleSheets].forEach((ss) => {
      try {
        const css = [...ss.cssRules].map((r) => r.cssText).join('\n');
        const st = pip.document.createElement('style');
        st.textContent = css;
        pip.document.head.append(st);
      } catch {
        if (ss.href) { const l = pip.document.createElement('link'); l.rel = 'stylesheet'; l.href = ss.href; pip.document.head.append(l); }
      }
    });
    pip.document.title = 'Pomodoro';
    const sprite = document.getElementById('sprite');
    pip.document.body.className = 'pip';
    pip.document.body.innerHTML = `${sprite ? sprite.outerHTML : ''}<div id="pipRoot"></div>`;
    App.pip = pip;
    syncPipTheme();
    pip.document.addEventListener('click', onClick);
    pip.document.addEventListener('keydown', onKey);
    pip.addEventListener('pagehide', () => { App.pip = null; App.renderChrome(); });
    App.renderMini();
    App.onTick();
    return true;
  } catch { return false; }
}
function syncPipTheme() {
  const src = document.documentElement;
  const dst = App.pip && App.pip.document.documentElement;
  if (!dst) return;
  ['mode', 'skin', 'theme'].forEach((k) => { if (src.dataset[k]) dst.dataset[k] = src.dataset[k]; else delete dst.dataset[k]; });
}

let animeFontsLoaded = false;
function loadAnimeFonts() {
  if (animeFontsLoaded) return;
  animeFontsLoaded = true;
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Mochiy+Pop+One&display=swap';
  document.head.append(l);
}

/* ---------- Aktionen ---------- */
const NUM_RANGES = { focus: [1, 240], short: [1, 60], long: [1, 120], longEvery: [1, 12], dailyGoalMin: [0, 960], capacity: [1, 30] };

function resetIdleTimer() {
  const x = Store.state.timer;
  if (x.status === 'idle') { x.remaining = null; x.duration = null; Store.commitTimer(); }
}

function createTask(form, fd) {
  const title = String(fd.get('title') || '').trim();
  if (!title) return;
  const t = {
    id: U.uid('t'), title, projectId: fd.get('projectId') || null,
    estimate: U.clamp(parseInt(fd.get('estimate'), 10) || 1, 1, 40),
    date: fd.get('date') || null, time: null, done: false, notes: '',
  };
  App.ui.lastProject = t.projectId || '';
  App.saveUi();
  const inp = form.querySelector('[name="title"]');
  if (inp) inp.value = '';
  Store.saveTask(t);
  const again = document.getElementById(inp && inp.id);
  if (again && !U.isTouch) again.focus();
}

function deleteTaskWithUndo(id) {
  const affected = Store.state.sessions.filter((s) => s.taskId === id).map((s) => U.clone(s));
  const timerTarget = Store.state.timer.target;
  const t = Store.deleteTask(id);
  if (!t) return;
  UI.toast(`«${t.title}» gelöscht`, {
    action: {
      label: 'Rückgängig',
      fn: () => {
        Store.saveTask(t);
        affected.forEach((s) => Store.saveSession(s));
        if (timerTarget === `t:${id}`) { Store.state.timer.target = timerTarget; Store.commitTimer(); }
      },
    },
  });
}

const Actions = {
  go: (el) => App.go(el.dataset.view),
  toggle: () => Timer.toggle(),
  adjust: (el) => Timer.adjust(+el.dataset.min || 0),
  async phase(el) {
    const p = el.dataset.phase;
    const x = Store.state.timer;
    if (p === x.phase && x.status === 'idle') return;
    if (x.phase === 'focus' && x.status !== 'idle' && Timer.elapsedFocus() >= 60) {
      const v = await UI.choice({
        title: 'Fokus läuft noch',
        text: `Du hast ${U.fmtDur(Timer.elapsedFocus())} fokussiert. Was soll mit dieser Zeit passieren?`,
        buttons: [{ label: 'Abbrechen', value: null }, { label: 'Verwerfen', value: 'drop' }, { label: 'Speichern', value: 'save', kind: 'btn-primary' }],
      });
      if (!v) return;
      if (v === 'save') { Timer.finishEarly(); Timer.setPhase(p); return; }
    }
    Timer.setPhase(p);
  },
  finish() {
    const x = Store.state.timer;
    if (x.phase !== 'focus' || x.status === 'idle') return;
    const s = Timer.finishEarly();
    UI.toast(s ? `${U.fmtDur(s.sec)} gespeichert – Zeit für eine Pause` : 'Weniger als 1 Minute – nicht gespeichert');
  },
  skip: () => { if (Store.state.timer.phase !== 'focus') Timer.skip(); },
  async reset() {
    const x = Store.state.timer;
    if (x.phase === 'focus' && Timer.elapsedFocus() >= 60) {
      const ok = await UI.confirm(`Die bisherige Fokuszeit (${U.fmtDur(Timer.elapsedFocus())}) wird nicht gespeichert.`, { title: 'Timer zurücksetzen?', ok: 'Zurücksetzen', danger: true });
      if (!ok) return;
    }
    Timer.reset();
  },
  applyPreset(el) {
    const p = (Store.settings.presets || []).find((x) => x.id === el.dataset.id);
    if (!p) return;
    Store.updateSettings({ focus: p.focus, short: p.short, long: p.long, longEvery: p.longEvery });
    resetIdleTimer();
    UI.toast(`Vorlage «${p.name}»: ${p.focus} min Fokus, ${p.short} min Pause`);
  },
  deletePreset(el) {
    const list = (Store.settings.presets || []).filter((x) => x.id !== el.dataset.id);
    Store.updateSettings({ presets: list });
  },
  focusTask(el) {
    const x = Store.state.timer;
    x.target = `t:${el.dataset.id}`;
    if (App.view !== 'fokus') App.go('fokus');
    if (x.status === 'idle' && x.phase === 'focus') Timer.start(); else Store.commitTimer();
  },
  focusProject(el) {
    Store.state.timer.target = `p:${el.dataset.id}`;
    Store.commitTimer();
    App.go('fokus');
  },
  doneTarget() {
    const tg = Store.resolveTarget(Store.state.timer.target);
    if (!tg.task) return;
    const t = tg.task;
    t.done = true;
    Store.saveTask(t);
    UI.toast(`«${t.title}» erledigt ✓`, { action: { label: 'Rückgängig', fn: () => { t.done = false; Store.saveTask(t); } } });
  },
  editTask(el) { const t = Store.task(el.dataset.id); if (t) openTaskDialog(t); },
  deleteTask(el) { UI.closeDialog(); deleteTaskWithUndo(el.dataset.id); },
  addTaskOn(el) { openTaskDialog(null, { date: el.dataset.date || null }); },
  shiftTask(el) {
    const t = Store.task(el.dataset.id);
    if (!t || !t.date) return;
    t.date = U.dateKey(U.addDays(U.parseKey(t.date), +el.dataset.d));
    Store.saveTask(t);
  },
  planToday(el) {
    const t = Store.task(el.dataset.id);
    if (!t) return;
    t.date = U.todayKey();
    Store.saveTask(t);
    UI.toast(`«${t.title}» für heute geplant`);
  },
  taskFilter(el) { App.ui.taskFilter[el.dataset.k] = el.dataset.v; App.saveUi(); App.render(); },

  newProject: () => openProjectDialog(null),
  editProject(el) { const p = Store.project(el.dataset.id); if (p) openProjectDialog(p); },
  openProject(el) { App.ui.projectId = el.dataset.id; App.go('projekte', { keepProject: true }); },
  closeProject() { App.ui.projectId = null; App.saveUi(); App.render(); },
  toggleArchived() { App.ui.showArchived = !App.ui.showArchived; App.saveUi(); App.render(); },
  async deleteProject(el) {
    const p = Store.project(el.dataset.id);
    if (!p) return;
    UI.closeDialog();
    const st = Store.projectStats(p.id);
    const v = await UI.choice({
      title: `«${p.name}» löschen?`,
      text: `${st.sec ? `Die erfasste Zeit (${U.fmtDur(st.sec)}) bleibt in der Auswertung unter «${CATS[p.category].label}» erhalten. ` : ''}Tipp: Archivieren blendet das Projekt aus, ohne etwas zu löschen.`,
      buttons: [
        { label: 'Abbrechen', value: null },
        ...(st.total ? [{ label: `Mit ${st.total} Aufgabe${st.total === 1 ? '' : 'n'} löschen`, value: 'all', kind: 'btn-danger' }] : []),
        { label: st.total ? 'Nur Projekt löschen' : 'Löschen', value: 'project', kind: st.total ? 'btn-ghost' : 'btn-danger' },
      ],
    });
    if (!v) return;
    Store.deleteProject(p.id, v === 'all');
    App.ui.projectId = null; App.saveUi(); App.render();
    UI.toast(`Projekt «${p.name}» gelöscht`);
  },

  calMode(el) { App.ui.cal.mode = el.dataset.v; App.saveUi(); App.render(); },
  calNav(el) {
    const c = App.ui.cal;
    const a = U.parseKey(c.anchor);
    c.anchor = U.dateKey(c.mode === 'week' ? U.addDays(a, 7 * +el.dataset.d) : U.addMonths(a, +el.dataset.d));
    if (c.mode === 'month') c.selected = U.dateKey(U.startOfMonth(U.parseKey(c.anchor)));
    App.render();
  },
  calToday() { const k = U.todayKey(); App.ui.cal.anchor = k; App.ui.cal.selected = k; App.render(); },
  calSelect(el) {
    const k = el.dataset.date;
    App.ui.cal.selected = k;
    App.render();
    if (window.innerWidth < 900) document.querySelector('.day-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },

  statsRange(el) { App.ui.stats.range = el.dataset.v; App.ui.logLimit = 50; App.saveUi(); App.render(); },
  statsNav(el) { const s = App.ui.stats; s.anchor = shiftAnchor(s.range, s.anchor, +el.dataset.d); App.render(); },
  statsToday() { App.ui.stats.anchor = U.todayKey(); App.render(); },
  moreLog() { App.ui.logLimit = (App.ui.logLimit || 50) + 100; App.render(); },
  copySummary() {
    const s = App.ui.stats;
    UI.copy(summaryText(summarize(s.range, s.anchor)), document.getElementById('summaryText'));
  },
  exportCsv() {
    const s = App.ui.stats;
    const R = statsRange(s.range, s.anchor);
    UI.saveFile(`pomodoro-zeiten-${U.dateKey(R.start)}.csv`, sessionsCsv(Store.sessionsBetween(R.start, R.end)), 'text/csv');
  },
  exportCsvAll() { UI.saveFile(`pomodoro-zeiten-alle-${U.todayKey()}.csv`, sessionsCsv(Store.state.sessions), 'text/csv'); },
  addSession: () => openSessionDialog(null),
  editSession(el) { const s = Store.session(el.dataset.id); if (s) openSessionDialog(s); },
  deleteSession(el) {
    UI.closeDialog();
    const s = Store.deleteSession(el.dataset.id);
    if (s) UI.toast(`Eintrag (${U.fmtDur(s.sec)}) gelöscht`, { action: { label: 'Rückgängig', fn: () => Store.saveSession(s) } });
  },

  setMode(el) { App.ui.mode = el.dataset.v; App.saveUi(); App.applyTheme(); App.render(); },
  setSkin(el) { App.ui.skin = el.dataset.v; App.saveUi(); App.applyTheme(); App.render(); },
  toggleTheme() { App.ui.mode = App.isDark() ? 'tag' : 'nacht'; App.saveUi(); App.applyTheme(); App.render(); },
  stepSetting(el) {
    const k = el.dataset.key;
    const [a, b] = NUM_RANGES[k] || [0, 999];
    const v = U.clamp((Store.settings[k] || 0) + +el.dataset.d, a, b);
    Store.updateSettings({ [k]: v });
    if (['focus', 'short', 'long'].includes(k)) resetIdleTimer();
  },
  testSound: () => Timer.testSound(),
  async install() {
    const p = App.installPrompt;
    if (!p) return;
    p.prompt();
    try { await p.userChoice; } catch { /* abgebrochen */ }
    App.installPrompt = null;
    App.render();
  },
  async downloadApp() {
    const url = window.PP_BUILD === 'artifact' ? 'pomodoro-planer.html' : 'download/pomodoro-planer.html';
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(String(res.status));
      const html = await res.text();
      const ok = await UI.saveFile('pomodoro-planer.html', html, 'text/html');
      if (ok) UI.toast('Offline-Datei gespeichert – per Doppelklick öffnen');
    } catch {
      UI.toast('Die Offline-Datei ist hier nicht verfügbar. Lade sie auf GitHub herunter (siehe README).', { timeout: 7000 });
    }
  },
  exportJson() {
    UI.saveFile(`pomodoro-planer-backup-${U.todayKey()}.json`, JSON.stringify(Store.exportData(), null, 1), 'application/json')
      .then((ok) => { if (ok) UI.toast('Backup exportiert'); });
  },
  async importJson() {
    const file = await UI.pickFile('.json,application/json');
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); } catch { UI.toast('Die Datei ist kein gültiges Backup (JSON).'); return; }
    if (!data || (!Array.isArray(data.projects) && !Array.isArray(data.tasks) && !Array.isArray(data.sessions))) {
      UI.toast('In der Datei wurden keine Planer-Daten gefunden.'); return;
    }
    const n = (k) => (Array.isArray(data[k]) ? data[k].length : 0);
    const v = await UI.choice({
      title: 'Backup importieren',
      text: `Gefunden: ${n('projects')} Projekte, ${n('tasks')} Aufgaben, ${n('sessions')} Zeiteinträge. «Zusammenführen» ergänzt deine Daten, «Ersetzen» löscht zuerst alles Bestehende.`,
      buttons: [{ label: 'Abbrechen', value: null }, { label: 'Ersetzen', value: 'replace', kind: 'btn-danger' }, { label: 'Zusammenführen', value: 'merge', kind: 'btn-primary' }],
    });
    if (!v) return;
    if (v === 'replace') { Store.replaceAll(data); if (data.settings) Store.updateSettings(Store.normalize({ settings: data.settings }).settings); }
    else Store.mergeAll(data);
    UI.toast('Backup importiert');
  },
  loadDemo() {
    Store.mergeAll(makeDemoData());
    UI.toast('Beispieldaten geladen – in den Einstellungen kannst du sie wieder entfernen.', { timeout: 6000 });
  },
  removeDemo() { Store.removeDemo(); UI.toast('Beispieldaten entfernt'); },
  async clearAll() {
    const ok = await UI.confirm('Alle Projekte, Aufgaben und erfassten Zeiten werden gelöscht. Exportiere vorher ein Backup, wenn du sie behalten willst.', { title: 'Alle Daten löschen?', ok: 'Alles löschen', danger: true });
    if (ok) { Store.clearAll(); UI.toast('Alle Daten gelöscht'); }
  },
  async minimize() {
    if (App.pip) { App.pip.close(); App.pip = null; return; }
    if (!App.ui.mini && window.top === window && await openPip()) return;
    App.ui.mini = !App.ui.mini;
    App.saveUi();
    App.render();
  },
  miniClose() {
    if (App.pip) { App.pip.close(); App.pip = null; window.focus(); }
    App.ui.mini = false;
    App.saveUi();
    App.render();
  },
};

const Changes = {
  target(el) { Store.state.timer.target = el.value; Store.commitTimer(); },
  taskDone(el) {
    const t = Store.task(el.dataset.id);
    if (!t) return;
    t.done = el.checked;
    Store.saveTask(t);
    if (t.done) UI.toast(`«${t.title}» erledigt ✓`, { action: { label: 'Rückgängig', fn: () => { t.done = false; Store.saveTask(t); } } });
  },
  taskFilterProject(el) { App.ui.taskFilter.project = el.value; App.saveUi(); App.render(); },
  setting(el) {
    const k = el.dataset.key;
    const [a, b] = NUM_RANGES[k] || [0, 999];
    const v = U.clamp(parseInt(el.value, 10) || a, a, b);
    Store.updateSettings({ [k]: v });
    if (['focus', 'short', 'long'].includes(k)) resetIdleTimer();
  },
  settingNum(el) { Store.updateSettings({ [el.dataset.key]: parseFloat(el.value) }); },
  async settingBool(el) {
    const k = el.dataset.key;
    const on = el.checked;
    if (k === 'notify' && on) {
      const r = await Timer.requestNotify();
      if (r !== 'granted') {
        el.checked = false;
        UI.toast(r === 'unsupported' ? 'Benachrichtigungen werden hier nicht unterstützt.' : 'Benachrichtigungen sind blockiert. Erlaube sie in den Browser-Einstellungen.', { timeout: 6000 });
        return;
      }
    }
    Store.updateSettings({ [k]: on });
    if (k === 'sound' || k === 'volume') Timer.scheduleChime();
    if (k === 'background') { Timer.ensureAudio(); Timer.syncMedia(true); }
  },
};

const Forms = {
  quickTask: createTask,
  dayTask: createTask,
  projectTask: createTask,
  newTask(form, fd) {
    createTask(form, fd);
    const d = form.querySelector('[name="date"]');
    if (d) d.value = '';
  },
  savePreset(form, fd) {
    const name = String(fd.get('name') || '').trim();
    if (!name) return;
    const s = Store.settings;
    form.querySelector('[name="name"]').value = '';
    Store.updateSettings({ presets: [...(s.presets || []), { id: U.uid('v'), name, focus: s.focus, short: s.short, long: s.long, longEvery: s.longEvery }] });
    UI.toast(`Vorlage «${name}» gespeichert`);
  },
};

const Inputs = {
  taskSearch: U.debounce((el) => { App.ui.taskFilter.q = el.value; App.saveUi(); App.render(); }, 200),
};

/* ---------- Ereignisse ---------- */
function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (App.connecting) return;
  const fn = Actions[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
}

function onKey(e) {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  const el = e.target;
  const tag = el && el.tagName;
  const typing = el && (el.isContentEditable || tag === 'TEXTAREA' || tag === 'SELECT'
    || (tag === 'INPUT' && !['checkbox', 'radio', 'range', 'button', 'submit', 'reset'].includes(el.type)));
  if (typing || App.connecting) return;
  if (document.getElementById('dlg').open) return;
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) Timer.toggle();
    return;
  }
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  const x = Store.state.timer;
  if (k === 'f' && x.phase === 'focus' && x.status !== 'idle') Actions.finish();
  else if (k === 's' && x.phase !== 'focus') Actions.skip();
  else if (k === 'm') Actions.minimize();
  else if (k === 't') Actions.toggleTheme();
  else if (k === 'n') { e.preventDefault(); openTaskDialog(null, { date: U.todayKey() }); }
  else if (k === 'escape' && App.ui.mini) Actions.miniClose();
  else if (/^[1-6]$/.test(k) && !App.ui.mini) App.go(VIEW_ORDER[+k - 1]);
}

let dragId = null;
function bindDnD() {
  const clear = () => document.querySelectorAll('.is-drop').forEach((z) => z.classList.remove('is-drop'));
  document.addEventListener('dragstart', (e) => {
    const el = e.target.closest && e.target.closest('[data-task][draggable="true"]');
    if (!el) return;
    dragId = el.dataset.task;
    e.dataTransfer.setData('text/plain', dragId);
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => el.classList.add('is-dragging'));
  });
  document.addEventListener('dragend', () => {
    dragId = null; clear();
    document.querySelectorAll('.is-dragging').forEach((z) => z.classList.remove('is-dragging'));
  });
  document.addEventListener('dragover', (e) => {
    const z = e.target.closest && e.target.closest('[data-drop]');
    if (!z || !dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (!z.classList.contains('is-drop')) { clear(); z.classList.add('is-drop'); }
  });
  document.addEventListener('drop', (e) => {
    const z = e.target.closest && e.target.closest('[data-drop]');
    if (!z || !dragId) return;
    e.preventDefault();
    const t = Store.task(dragId);
    const d = z.dataset.drop === 'none' ? null : z.dataset.drop;
    clear();
    if (t && t.date !== d) { t.date = d; Store.saveTask(t); UI.toast(d ? `«${t.title}» geplant: ${U.relDay(d)}` : `«${t.title}» ist jetzt ungeplant`); }
  });
}

function bindEvents() {
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]');
    if (el && Changes[el.dataset.change]) Changes[el.dataset.change](el, e);
  });
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-input]');
    if (el && Inputs[el.dataset.input]) Inputs[el.dataset.input](el, e);
  });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const fn = Forms[form.dataset.form];
    if (fn) fn(form, new FormData(form));
  });
  bindDnD();
  window.addEventListener('hashchange', () => {
    const h = location.hash.slice(1);
    if (Views[h] && h !== App.view) App.go(h);
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { App.applyTheme(); App.renderChrome(); });
  new MutationObserver(() => { App.applyTheme(); App.renderChrome(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    App.installPrompt = e;
    App.renderChrome();
    if (App.view === 'einstellungen') App.render();
  });
  window.addEventListener('appinstalled', () => { App.installPrompt = null; App.renderChrome(); });
}

/* ---------- Start ---------- */
async function boot() {
  App.loadUi();
  App.applyTheme();
  Store.initLocal();
  const h = location.hash.slice(1);
  if (Views[h]) App.ui.view = h;
  if (h === 'mini') App.ui.mini = true;
  App.view = Views[App.ui.view] ? App.ui.view : 'fokus';
  bindEvents();
  Store.subscribe((reason) => {
    if (reason === 'status') { App.renderSaveState(); return; }
    if (reason === 'timer') {
      if (App.view === 'fokus') App.render(); else { App.renderChrome(); App.renderMini(); }
      return;
    }
    App.render();
  });
  const claude = window.claude && typeof window.claude.use === 'function';
  App.connecting = !!claude;
  App.render();
  setInterval(() => { if (!App.connecting) { Timer.tick(); App.onTick(); } }, 250);
  if (claude) {
    await Store.tryClaude();
    App.connecting = false;
    App.render();
  }
  Timer.resume();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !claude && (window.PP_BUILD || 'web') === 'web') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
