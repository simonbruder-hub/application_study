<script>
/* js/util.js */
/* Hilfsfunktionen: Datum, Formatierung, Escaping, IDs */
'use strict';

const U = (() => {
  const pad2 = (n) => String(n).padStart(2, '0');

  const WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  const WD_LONG = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
  const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const MONTHS_SHORT = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sept.', 'Okt.', 'Nov.', 'Dez.'];

  const toDate = (d) => (d instanceof Date ? new Date(d.getTime()) : typeof d === 'string' ? parseKey(d) : new Date(d));

  /** 'YYYY-MM-DD' in lokaler Zeit */
  const dateKey = (d = new Date()) => {
    const x = toDate(d);
    return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
  };
  const parseKey = (k) => {
    const [y, m, d] = String(k).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  };
  const todayKey = () => dateKey(new Date());
  const addDays = (d, n) => { const x = toDate(d); x.setDate(x.getDate() + n); return x; };
  const addMonths = (d, n) => { const x = toDate(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };
  const startOfDay = (d) => { const x = toDate(d); x.setHours(0, 0, 0, 0); return x; };
  /** Wochenstart Montag */
  const startOfWeek = (d) => { const x = startOfDay(d); x.setDate(x.getDate() - wdIndex(x)); return x; };
  const startOfMonth = (d) => { const x = toDate(d); return new Date(x.getFullYear(), x.getMonth(), 1); };
  const startOfYear = (d) => new Date(toDate(d).getFullYear(), 0, 1);
  const wdIndex = (d) => (toDate(d).getDay() + 6) % 7;
  const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
  const isoWeek = (d) => {
    const x = toDate(d);
    const t = new Date(Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  };
  const monthKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };

  /** Dauer in Sekunden → "1 h 05 min" / "45 min" */
  const fmtDur = (sec) => {
    const m = Math.round((sec || 0) / 60);
    const h = Math.floor(m / 60);
    const r = m % 60;
    if (h === 0) return `${r} min`;
    return r ? `${h} h ${pad2(r)} min` : `${h} h`;
  };
  /** kompakt: "1:05" */
  const fmtHM = (sec) => {
    const m = Math.round((sec || 0) / 60);
    return `${Math.floor(m / 60)}:${pad2(m % 60)}`;
  };
  /** Countdown: "24:59" bzw. "1:29:59" */
  const fmtClock = (sec) => {
    const s = Math.max(0, Math.ceil(sec));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    return h ? `${h}:${pad2(m)}:${pad2(r)}` : `${pad2(m)}:${pad2(r)}`;
  };
  const fmtTime = (ms) => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  /** "14.10.2026" */
  const fmtDate = (d) => { const x = toDate(d); return `${pad2(x.getDate())}.${pad2(x.getMonth() + 1)}.${x.getFullYear()}`; };
  /** "Mi, 14.10." */
  const fmtDay = (d) => { const x = toDate(d); return `${WD[wdIndex(x)]}, ${pad2(x.getDate())}.${pad2(x.getMonth() + 1)}.`; };
  /** "Mittwoch, 14. Oktober 2026" */
  const fmtDayLong = (d) => { const x = toDate(d); return `${WD_LONG[wdIndex(x)]}, ${x.getDate()}. ${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
  /** "Heute" / "Morgen" / "Gestern" / "Mi, 14.10." */
  const relDay = (key) => {
    const diff = daysBetween(new Date(), parseKey(key));
    if (diff === 0) return 'Heute';
    if (diff === 1) return 'Morgen';
    if (diff === -1) return 'Gestern';
    return fmtDay(key);
  };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = (p) => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const sum = (arr, f = (x) => x) => arr.reduce((a, x) => a + (f(x) || 0), 0);
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);

  /** Deterministischer Zufall für Beispieldaten */
  const rng = (seed) => () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  /** Lokale Uhrzeit "HH:MM" am Tag key → ms */
  const atTime = (key, hhmm) => {
    const d = parseKey(key);
    const [h, m] = String(hhmm || '00:00').split(':').map(Number);
    d.setHours(h || 0, m || 0, 0, 0);
    return d.getTime();
  };

  const isAndroid = /Android/i.test(navigator.userAgent || '');
  const isTouch = matchMedia('(pointer: coarse)').matches;

  return {
    pad2, WD, WD_LONG, MONTHS, MONTHS_SHORT, dateKey, parseKey, todayKey, addDays, addMonths, startOfDay,
    startOfWeek, startOfMonth, startOfYear, wdIndex, daysBetween, isoWeek, monthKey, fmtDur, fmtHM, fmtClock,
    fmtTime, fmtDate, fmtDay, fmtDayLong, relDay, esc, uid, clamp, sum, debounce, clone, pct, rng, atTime,
    isAndroid, isTouch,
  };
})();

/* js/store.js */
/* Datenhaltung: Zustand, Abfragen, Änderungen und Speicherung
 * (lokal im Browser oder – in claude.ai – synchronisiert im Konto). */
'use strict';

const CATS = {
  lernen: { label: 'Lernen' },
  arbeit: { label: 'Arbeit' },
  sonstiges: { label: 'Sonstiges' },
};
const CAT_KEYS = Object.keys(CATS);

/* Projektfarben: Index 1–8, Werte als CSS-Variablen --pc-1 … --pc-8 (hell/dunkel) */
const PROJECT_COLORS = ['Blau', 'Orange', 'Türkis', 'Gelb', 'Rosa', 'Grün', 'Violett', 'Rot'];

const DEFAULT_PRESETS = [
  { id: 'klassisch', name: 'Klassisch', focus: 25, short: 5, long: 15, longEvery: 4 },
  { id: 'kurz', name: 'Kurz', focus: 15, short: 3, long: 10, longEvery: 4 },
  { id: 'lang', name: 'Lang', focus: 50, short: 10, long: 20, longEvery: 3 },
  { id: 'deep', name: 'Deep Work', focus: 90, short: 15, long: 30, longEvery: 2 },
];

const DEFAULT_SETTINGS = {
  focus: 25, short: 5, long: 15, longEvery: 4,
  autoBreak: true, autoFocus: false,
  sound: true, volume: 0.7, notify: false, wakeLock: false, background: false,
  dailyGoalMin: 240, capacity: 8,
  presets: DEFAULT_PRESETS,
};

const freshTimer = () => ({
  phase: 'focus', status: 'idle', remaining: null, duration: null, endsAt: null,
  segmentStart: null, focusAccum: 0, sessionStart: null, cycle: 0, target: '',
});

const LS_KEY = 'pomodoro-planer.v1';

/* ---------- Speicher-Backends ---------- */

/** Lokal: ganzer Zustand als JSON in localStorage */
const LocalBackend = {
  name: 'local',
  load() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
  },
  _save: null,
  touch() {
    Store._setStatus('saving');
    if (!this._save) {
      this._save = U.debounce(() => this.flush(), 250);
    }
    this._save();
  },
  flush() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(Store.state));
      Store._setStatus('saved');
    } catch {
      Store._setStatus('error', 'Der Browser blockiert den lokalen Speicher. Exportiere deine Daten als Backup.');
    }
  },
};

/** claude.ai: private Dokumente unter data/users/<id>/ */
const ClaudeBackend = {
  name: 'claude',
  db: null,
  base: '',
  pending: new Map(),
  inflight: new Set(),
  knownMonths: new Set(),

  async connect() {
    if (!window.claude || typeof window.claude.use !== 'function') return false;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return false;
      const id = await user.id();
      if (!id) return false;
      this.db = db;
      this.base = `data/users/${id}`;
      return true;
    } catch { return false; }
  },
  planner() { return this.db.doc(`${this.base}/planner`); },

  async getAll(col) {
    const out = [];
    let last = null;
    for (let i = 0; i < 200; i++) {
      const q = last === null ? col.orderBy('id').limit(500) : col.where('id', '>', last).orderBy('id').limit(500);
      const snap = await q.get();
      snap.docs.forEach((d) => { const v = d.data(); if (v) out.push(U.clone(v)); });
      if (snap.size < 500) break;
      last = snap.docs[snap.size - 1].data().id;
    }
    return out;
  },

  async load() {
    const root = this.planner();
    const [settings, timer, projects, tasks, months] = await Promise.all([
      this.db.doc(`${this.base}/settings`).get(),
      this.db.doc(`${this.base}/timer`).get(),
      this.getAll(root.collection('projects')),
      this.getAll(root.collection('tasks')),
      this.getAll(root.collection('months')),
    ]);
    months.forEach((m) => this.knownMonths.add(m.id));
    const sessions = months.flatMap((m) => (Array.isArray(m.sessions) ? m.sessions : []));
    const empty = !settings.exists && !timer.exists && !projects.length && !tasks.length && !sessions.length;
    if (empty) return null;
    return {
      settings: settings.exists ? U.clone(settings.data()) : {},
      timer: timer.exists ? U.clone(timer.data()) : null,
      projects, tasks, sessions,
    };
  },

  /** kind: settings | timer | project | task | month */
  touch(kind, key) {
    let path;
    let body;
    const st = Store.state;
    if (kind === 'settings') { path = `${this.base}/settings`; body = () => st.settings; }
    else if (kind === 'timer') { path = `${this.base}/timer`; body = () => st.timer; }
    else if (kind === 'project') { path = `${this.base}/planner/projects/${key}`; body = () => Store.project(key) || null; }
    else if (kind === 'task') { path = `${this.base}/planner/tasks/${key}`; body = () => Store.task(key) || null; }
    else if (kind === 'month') {
      this.knownMonths.add(key);
      path = `${this.base}/planner/months/${key}`;
      body = () => ({ id: key, sessions: st.sessions.filter((s) => U.monthKey(s.start) === key) });
    } else return;
    this.pending.set(path, body);
    this.pump(path);
  },

  async pump(path) {
    if (this.inflight.has(path) || !this.pending.has(path)) { this._updateStatus(); return; }
    const resolve = this.pending.get(path);
    this.pending.delete(path);
    this.inflight.add(path);
    this._updateStatus();
    const data = resolve();
    try {
      await this._write(path, data);
    } catch (e) {
      if (e && e.code === 'unavailable') {
        await new Promise((r) => setTimeout(r, 400 + Math.random() * 600));
        try { await this._write(path, resolve()); } catch (e2) { this._fail(e2); }
      } else this._fail(e);
    } finally {
      this.inflight.delete(path);
      if (this.pending.has(path)) this.pump(path); else this._updateStatus();
    }
  },
  async _write(path, data) {
    const ref = this.db.doc(path);
    if (data === null || (data.sessions && data.sessions.length === 0)) await ref.delete();
    else await ref.set(U.clone(data));
  },
  _fail(e) {
    const code = e && e.code;
    const msg = code === 'quota_exceeded'
      ? 'Der Speicher ist voll. Exportiere ein Backup und lösche alte Einträge.'
      : 'Speichern fehlgeschlagen. Exportiere zur Sicherheit ein Backup.';
    Store._setStatus('error', msg);
  },
  _updateStatus() {
    if (Store.saveStatus === 'error') return;
    Store._setStatus(this.pending.size || this.inflight.size ? 'saving' : 'saved');
  },
  flush() {},
};

/* ---------- Store ---------- */

const Store = {
  state: null,
  backend: LocalBackend,
  saveStatus: 'saved',
  saveError: '',
  _subs: new Set(),

  subscribe(fn) { this._subs.add(fn); return () => this._subs.delete(fn); },
  emit(reason) { this._subs.forEach((fn) => fn(reason)); },
  _setStatus(s, msg = '') {
    if (this.saveStatus === s && this.saveError === msg) return;
    this.saveStatus = s; this.saveError = msg;
    this.emit('status');
  },

  normalize(raw) {
    const r = raw && typeof raw === 'object' ? raw : {};
    const settings = { ...U.clone(DEFAULT_SETTINGS), ...(r.settings || {}) };
    if (!Array.isArray(settings.presets) || !settings.presets.length) settings.presets = U.clone(DEFAULT_PRESETS);
    const timer = { ...freshTimer(), ...(r.timer || {}) };
    const arr = (a) => (Array.isArray(a) ? a.filter((x) => x && typeof x === 'object' && x.id) : []);
    return {
      settings,
      timer,
      projects: arr(r.projects),
      tasks: arr(r.tasks),
      sessions: arr(r.sessions).filter((s) => Number.isFinite(s.start) && Number.isFinite(s.sec)),
    };
  },

  initLocal() {
    this.state = this.normalize(LocalBackend.load());
    this.backend = LocalBackend;
    window.addEventListener('storage', (e) => {
      if (e.key !== LS_KEY || this.backend !== LocalBackend || !e.newValue) return;
      try { this.state = this.normalize(JSON.parse(e.newValue)); this.emit('reload'); } catch { /* ignorieren */ }
    });
    const flush = () => this.backend.flush();
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  },

  /** Versucht das claude.ai-Konto als Speicher zu verwenden. */
  async tryClaude() {
    const ok = await ClaudeBackend.connect();
    if (!ok) return false;
    let remote;
    try { remote = await ClaudeBackend.load(); } catch { return false; }
    const local = this.state;
    this.backend = ClaudeBackend;
    if (remote) {
      this.state = this.normalize(remote);
    } else if (local.projects.length || local.tasks.length || local.sessions.length) {
      // Erste Verbindung: lokale Daten ins Konto übernehmen
      this.state = local;
      this.touchAll();
    } else {
      this.state = this.normalize(null);
    }
    this.emit('reload');
    return true;
  },

  touch(kind, key) { this.backend.touch(kind, key); },
  touchAll(prev) {
    this.touch('settings');
    this.touch('timer');
    const ids = (k, list) => new Set([...(prev ? prev[k] : []), ...this.state[k]].map((x) => x.id));
    ids('projects').forEach((id) => this.touch('project', id));
    ids('tasks').forEach((id) => this.touch('task', id));
    const months = new Set([...(prev ? prev.sessions : []), ...this.state.sessions].map((s) => U.monthKey(s.start)));
    if (this.backend === ClaudeBackend) ClaudeBackend.knownMonths.forEach((m) => months.add(m));
    months.forEach((m) => this.touch('month', m));
  },

  /* ---------- Abfragen ---------- */
  get settings() { return this.state.settings; },
  project(id) { return id ? this.state.projects.find((p) => p.id === id) : undefined; },
  task(id) { return id ? this.state.tasks.find((t) => t.id === id) : undefined; },
  session(id) { return this.state.sessions.find((s) => s.id === id); },
  projects(archived = false) {
    return this.state.projects.filter((p) => !!p.archived === archived)
      .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'de'));
  },
  sessionProject(s) { return this.project(s.projectId) || (s.taskId ? this.project(this.task(s.taskId)?.projectId) : undefined); },
  sessionCat(s) { const p = this.sessionProject(s); return p ? p.category : (CATS[s.category] ? s.category : 'sonstiges'); },
  sessionLabel(s) {
    const t = this.task(s.taskId);
    if (t) return t.title;
    if (s.title) return s.title;
    const p = this.sessionProject(s);
    return p ? p.name : CATS[this.sessionCat(s)].label;
  },
  sessionsBetween(a, b) {
    const A = +a; const B = +b;
    return this.state.sessions.filter((s) => s.start >= A && s.start < B);
  },
  tasksOn(key) {
    return this.state.tasks.filter((t) => t.date === key).sort(taskSort);
  },
  taskStats(id) {
    let sec = 0; let pomos = 0;
    for (const s of this.state.sessions) if (s.taskId === id) { sec += s.sec; if (s.full) pomos++; }
    return { sec, pomos };
  },
  projectStats(id, a = 0, b = Infinity) {
    let sec = 0; let pomos = 0;
    for (const s of this.state.sessions) {
      if (s.start < a || s.start >= b) continue;
      if (this.sessionProject(s)?.id !== id) continue;
      sec += s.sec; if (s.full) pomos++;
    }
    const tasks = this.state.tasks.filter((t) => t.projectId === id);
    return { sec, pomos, open: tasks.filter((t) => !t.done).length, done: tasks.filter((t) => t.done).length, total: tasks.length };
  },
  /** Geplante Pomodoros an einem Tag (offene Aufgaben: Schätzung minus Erledigtes) */
  plannedLoad(key) {
    return U.sum(this.tasksOn(key), (t) => t.estimate || 1);
  },
  streak() {
    const days = new Set(this.state.sessions.map((s) => U.dateKey(s.start)));
    let n = 0;
    let d = new Date();
    if (!days.has(U.dateKey(d))) d = U.addDays(d, -1);
    while (days.has(U.dateKey(d))) { n++; d = U.addDays(d, -1); }
    return n;
  },
  hasDemo() {
    const s = this.state;
    return s.projects.some((x) => x.demo) || s.tasks.some((x) => x.demo) || s.sessions.some((x) => x.demo);
  },
  isEmpty() {
    const s = this.state;
    return !s.projects.length && !s.tasks.length && !s.sessions.length;
  },

  /* ---------- Änderungen ---------- */
  saveProject(p) {
    const list = this.state.projects;
    const i = list.findIndex((x) => x.id === p.id);
    p.updatedAt = Date.now();
    if (i >= 0) list[i] = p; else { p.createdAt = p.createdAt || Date.now(); list.push(p); }
    this.touch('project', p.id);
    this.emit('data');
  },
  deleteProject(id, deleteTasks) {
    const p = this.project(id);
    if (!p) return;
    // Erfasste Zeit bleibt erhalten – unter der Kategorie des Projekts
    const months = new Set();
    this.state.sessions.forEach((s) => {
      if (this.sessionProject(s)?.id !== id && s.projectId !== id) return;
      if (deleteTasks && s.taskId) { s.title = this.task(s.taskId)?.title || s.title || ''; s.taskId = null; }
      s.projectId = null;
      s.category = p.category;
      months.add(U.monthKey(s.start));
    });
    const own = this.state.tasks.filter((t) => t.projectId === id);
    if (deleteTasks) this.state.tasks = this.state.tasks.filter((t) => t.projectId !== id);
    else own.forEach((t) => { t.projectId = null; });
    own.forEach((t) => this.touch('task', t.id));
    this.state.projects = this.state.projects.filter((x) => x.id !== id);
    this.touch('project', id);
    const tg = this.state.timer.target;
    if (tg === `p:${id}` || (deleteTasks && own.some((t) => tg === `t:${t.id}`))) { this.state.timer.target = ''; this.touch('timer'); }
    months.forEach((m) => this.touch('month', m));
    this.emit('data');
  },
  saveTask(t) {
    const list = this.state.tasks;
    const i = list.findIndex((x) => x.id === t.id);
    t.updatedAt = Date.now();
    if (t.done && !t.doneAt) t.doneAt = Date.now();
    if (!t.done) t.doneAt = null;
    if (i >= 0) list[i] = t; else { t.createdAt = t.createdAt || Date.now(); list.push(t); }
    this.touch('task', t.id);
    this.emit('data');
  },
  deleteTask(id) {
    const t = this.task(id);
    if (!t) return null;
    this.state.tasks = this.state.tasks.filter((x) => x.id !== id);
    const months = new Set();
    this.state.sessions.forEach((s) => {
      if (s.taskId === id) {
        s.title = t.title; s.projectId = s.projectId || t.projectId || null; s.taskId = null;
        months.add(U.monthKey(s.start));
      }
    });
    if (this.state.timer.target === `t:${id}`) { this.state.timer.target = t.projectId ? `p:${t.projectId}` : ''; this.touch('timer'); }
    this.touch('task', id);
    months.forEach((m) => this.touch('month', m));
    this.emit('data');
    return t;
  },
  addSession(s) {
    this.state.sessions.push(s);
    this.touch('month', U.monthKey(s.start));
    this.emit('data');
  },
  saveSession(s, prevStart) {
    const list = this.state.sessions;
    const i = list.findIndex((x) => x.id === s.id);
    if (i >= 0) list[i] = s; else list.push(s);
    this.touch('month', U.monthKey(s.start));
    if (prevStart != null && U.monthKey(prevStart) !== U.monthKey(s.start)) this.touch('month', U.monthKey(prevStart));
    this.emit('data');
  },
  deleteSession(id) {
    const s = this.session(id);
    if (!s) return null;
    this.state.sessions = this.state.sessions.filter((x) => x.id !== id);
    this.touch('month', U.monthKey(s.start));
    this.emit('data');
    return s;
  },
  updateSettings(patch) {
    Object.assign(this.state.settings, patch);
    this.touch('settings');
    this.emit('settings');
  },
  commitTimer() {
    this.touch('timer');
    this.emit('timer');
  },

  /** Daten ersetzen (Import) */
  replaceAll(data) {
    const prev = this.state;
    const next = this.normalize(data);
    next.timer = freshTimer();
    this.state = next;
    this.touchAll(prev);
    this.emit('reload');
  },
  /** Daten zusammenführen (Import, gleiche IDs werden überschrieben) */
  mergeAll(data) {
    const inc = this.normalize(data);
    const merge = (k) => {
      const map = new Map(this.state[k].map((x) => [x.id, x]));
      inc[k].forEach((x) => map.set(x.id, x));
      this.state[k] = [...map.values()];
    };
    merge('projects'); merge('tasks'); merge('sessions');
    this.touchAll();
    this.emit('reload');
  },
  clearAll() {
    const prev = this.state;
    this.state = this.normalize(null);
    this.touchAll(prev);
    this.emit('reload');
  },
  removeDemo() {
    const prev = this.state;
    const s = this.state;
    this.state = {
      ...s,
      projects: s.projects.filter((x) => !x.demo),
      tasks: s.tasks.filter((x) => !x.demo),
      sessions: s.sessions.filter((x) => !x.demo),
    };
    const t = this.state.timer.target;
    if (t && !this.resolveTarget(t).valid) this.state.timer.target = '';
    this.touchAll(prev);
    this.emit('reload');
  },
  exportData() {
    const s = this.state;
    return { app: 'pomodoro-planer', version: 1, exportedAt: new Date().toISOString(), settings: s.settings, projects: s.projects, tasks: s.tasks, sessions: s.sessions };
  },

  /** Zuordnung "t:<task>", "p:<projekt>", "c:<kategorie>" oder "" auflösen */
  resolveTarget(target) {
    const [kind, id] = String(target || '').split(':');
    if (kind === 't') {
      const t = this.task(id);
      if (t) {
        const p = this.project(t.projectId);
        return { valid: true, taskId: t.id, projectId: p ? p.id : null, category: p ? p.category : 'sonstiges', title: t.title, task: t, project: p };
      }
    }
    if (kind === 'p') {
      const p = this.project(id);
      if (p) return { valid: true, taskId: null, projectId: p.id, category: p.category, title: p.name, project: p };
    }
    if (kind === 'c' && CATS[id]) return { valid: true, taskId: null, projectId: null, category: id, title: CATS[id].label };
    return { valid: !target, taskId: null, projectId: null, category: 'sonstiges', title: 'Ohne Zuordnung' };
  },
};

function taskSort(a, b) {
  if (!!a.done !== !!b.done) return a.done ? 1 : -1;
  const ta = a.time || '99:99';
  const tb = b.time || '99:99';
  if (ta !== tb) return ta < tb ? -1 : 1;
  return (a.createdAt || 0) - (b.createdAt || 0);
}

/* ---------- Beispieldaten ---------- */
function makeDemoData() {
  const r = U.rng(42);
  const today = U.startOfDay(new Date());
  const key = (n) => U.dateKey(U.addDays(today, n));
  const P = [
    { id: U.uid('p'), name: 'Beispiel: Regelungstechnik', category: 'lernen', color: 1, goalHours: 40, deadline: key(38), notes: 'Prüfung Ende Semester' },
    { id: U.uid('p'), name: 'Beispiel: Masterarbeit', category: 'lernen', color: 7, goalHours: 120, deadline: key(110), notes: '' },
    { id: U.uid('p'), name: 'Beispiel: Werkstudium', category: 'arbeit', color: 2, goalHours: null, deadline: null, notes: '20 % Pensum' },
  ];
  P.forEach((p) => { p.demo = true; p.archived = false; p.createdAt = Date.now() - 20 * 86400000; });
  const T = [
    [0, 'Übungsserie 4 lösen', 3, -1, true], [0, 'Bode-Diagramme repetieren', 2, 0, false], [0, 'Zusammenfassung Kapitel 5', 2, 1, false],
    [0, 'Altprüfung 2024 durchrechnen', 4, 4, false], [1, 'Literaturrecherche Batteriemodelle', 3, -2, true],
    [1, 'Messaufbau skizzieren', 2, 0, false], [1, 'Gliederung Kapitel 2', 2, 2, false], [1, 'Treffen mit Betreuer vorbereiten', 1, 3, false],
    [2, 'Wochenbericht schreiben', 1, 0, false], [2, 'Datenauswertung Q3', 3, 1, false], [2, 'Code-Review', 1, -3, true],
    [0, 'Formelsammlung ergänzen', 1, null, false], [1, 'Abbildungen überarbeiten', 2, null, false],
  ].map(([pi, title, est, d, done]) => ({
    id: U.uid('t'), title, projectId: P[pi].id, estimate: est, date: d === null ? null : key(d),
    time: null, done, doneAt: done ? Date.now() - 86400000 : null, notes: '', demo: true, createdAt: Date.now() - 10 * 86400000,
  }));
  const S = [];
  for (let back = 20; back >= 0; back--) {
    const day = U.addDays(today, -back);
    const wd = U.wdIndex(day);
    const n = back === 0 ? 2 : wd >= 5 ? Math.floor(r() * 3) : 2 + Math.floor(r() * 5);
    let t = new Date(day); t.setHours(8 + Math.floor(r() * 2), Math.floor(r() * 4) * 15, 0, 0);
    for (let i = 0; i < n; i++) {
      const pick = r();
      const pi = wd >= 5 ? (pick < 0.7 ? 0 : 1) : pick < 0.45 ? 0 : pick < 0.75 ? 1 : 2;
      const tasks = T.filter((x) => x.projectId === P[pi].id);
      const task = tasks[Math.floor(r() * tasks.length)];
      const full = r() > 0.15;
      const sec = full ? 25 * 60 : (10 + Math.floor(r() * 14)) * 60;
      const start = t.getTime();
      if (start + sec * 1000 > Date.now()) break;
      S.push({ id: U.uid('s'), start, end: start + sec * 1000, sec, full, taskId: task.id, projectId: P[pi].id, category: P[pi].category, title: task.title, note: '', manual: false, demo: true });
      t = new Date(start + sec * 1000 + ((i + 1) % 4 === 0 ? 15 : 5) * 60000 + (r() < 0.25 ? 60 * 60000 : 0));
    }
  }
  return { projects: P, tasks: T, sessions: S };
}

/* js/timer.js */
/* Pomodoro-Timer: Phasen, Zeitmessung über Zeitstempel (läuft auch in
 * Hintergrund-Tabs korrekt), Signalton, Benachrichtigung, Wake Lock,
 * Medien-Steuerung (Android-Benachrichtigung / Sperrbildschirm). */
'use strict';

const PHASES = {
  focus: { label: 'Fokus', short: 'Fokus', kanji: '集中' },
  short: { label: 'Kurze Pause', short: 'Pause', kanji: '休憩' },
  long: { label: 'Lange Pause', short: 'Lange Pause', kanji: '休息' },
};

const Timer = (() => {
  let audio = null;
  let chimeNodes = [];
  let chimeAt = null;
  let wakeLock = null;
  let bgAudio = null;
  let lastMediaMinute = null;

  const t = () => Store.state.timer;
  const S = () => Store.state.settings;

  const durationOf = (phase) => Math.max(60, Math.round((S()[phase] || 1) * 60));
  const duration = () => t().duration ?? durationOf(t().phase);
  const remaining = (now = Date.now()) => {
    const x = t();
    if (x.status === 'running') return Math.max(0, (x.endsAt - now) / 1000);
    return x.remaining ?? durationOf(x.phase);
  };
  const elapsedFocus = (now = Date.now()) => {
    const x = t();
    if (x.phase !== 'focus') return 0;
    let s = x.focusAccum || 0;
    if (x.status === 'running' && x.segmentStart) s += (now - x.segmentStart) / 1000;
    return s;
  };
  const isRunning = () => t().status === 'running';
  const isActive = () => t().status !== 'idle';

  function commit() {
    Store.commitTimer();
    syncMedia(true);
  }

  function start(at = Date.now()) {
    const x = t();
    if (x.status === 'running') return;
    ensureAudio();
    if (x.status === 'idle') {
      if (x.remaining == null) { x.duration = durationOf(x.phase); x.remaining = x.duration; }
      if (x.phase === 'focus') { x.sessionStart = at; x.focusAccum = 0; }
    }
    x.endsAt = at + x.remaining * 1000;
    if (x.phase === 'focus') x.segmentStart = at;
    x.status = 'running';
    scheduleChime();
    requestWake();
    commit();
  }

  function pause() {
    const x = t();
    if (x.status !== 'running') return;
    const now = Date.now();
    x.remaining = Math.max(1, (x.endsAt - now) / 1000);
    if (x.phase === 'focus' && x.segmentStart) { x.focusAccum += (now - x.segmentStart) / 1000; x.segmentStart = null; }
    x.endsAt = null;
    x.status = 'paused';
    cancelChime();
    releaseWake();
    commit();
  }

  const toggle = () => (isRunning() ? pause() : start());

  /** Laufende/geplante Phase um min Minuten verlängern/verkürzen */
  function adjust(min) {
    const x = t();
    const rem = remaining();
    const next = Math.max(60, rem + min * 60);
    const delta = next - rem;
    if (delta === 0) return;
    if (x.status === 'running') { x.endsAt += delta * 1000; x.duration = duration() + delta; scheduleChime(); }
    else { x.remaining = next; x.duration = Math.max(next, duration() + delta); }
    commit();
  }

  function toIdle(phase) {
    const x = t();
    cancelChime();
    releaseWake();
    Object.assign(x, { phase, status: 'idle', remaining: null, duration: null, endsAt: null, segmentStart: null, focusAccum: 0, sessionStart: null });
  }

  function setPhase(phase) { toIdle(phase); commit(); }
  function reset() { toIdle(t().phase); commit(); }

  function logFocus(endMs, full) {
    const x = t();
    let sec = x.focusAccum || 0;
    if (x.segmentStart) sec += (endMs - x.segmentStart) / 1000;
    sec = Math.round(sec);
    if (sec < 60) return null;
    const tg = Store.resolveTarget(x.target);
    const s = {
      id: U.uid('s'), start: x.sessionStart ?? endMs - sec * 1000, end: endMs, sec, full,
      taskId: tg.taskId, projectId: tg.projectId, category: tg.category, title: tg.taskId || tg.projectId ? tg.title : '',
      note: '', manual: false,
    };
    Store.addSession(s);
    return s;
  }

  /** Fokus abschliessen → Pause vorbereiten */
  function finishFocus(endMs, full) {
    const x = t();
    const s = logFocus(endMs, full);
    x.cycle = (x.cycle || 0) + 1;
    const every = Math.max(1, S().longEvery || 4);
    toIdle(x.cycle % every === 0 ? 'long' : 'short');
    return s;
  }

  /** Fokus vorzeitig beenden und speichern */
  function finishEarly() {
    const x = t();
    if (x.phase !== 'focus') { skip(); return null; }
    const now = Date.now();
    const full = elapsedFocus(now) >= duration() * 0.5;
    const s = finishFocus(now, full);
    if (S().autoBreak) start(); else commit();
    return s;
  }

  /** Pause überspringen */
  function skip() {
    toIdle('focus');
    commit();
  }

  /** Phase ist regulär abgelaufen */
  function complete(endMs) {
    const x = t();
    const phase = x.phase;
    const scheduled = chimeAt === endMs && audio && audio.state === 'running';
    chimeNodes = []; chimeAt = null; // geplanter Ton soll weiterklingen
    let s = null;
    if (phase === 'focus') s = finishFocus(endMs, true);
    else toIdle('focus');
    const next = t().phase;
    if (!scheduled) chime(phase === 'focus' ? 'focusEnd' : 'breakEnd');
    const msg = phase === 'focus'
      ? `${s ? 'Pomodoro geschafft' : 'Fokus beendet'} – ${PHASES[next].label} (${S()[next]} min)`
      : 'Pause vorbei – weiter geht’s mit Fokus';
    notify(phase === 'focus' ? 'Fokus beendet' : 'Pause vorbei', msg);
    App.onPhaseComplete(phase, next, s, msg);
    const auto = next === 'focus' ? S().autoFocus : S().autoBreak;
    if (auto && Date.now() - endMs < durationOf(next) * 1000) start(endMs); else commit();
  }

  function tick() {
    const x = t();
    if (x.status === 'running' && Date.now() >= x.endsAt) complete(x.endsAt);
    syncMedia(false);
  }

  /** Nach dem Laden: abgelaufene Phase nachtragen, Ton neu planen */
  function resume() {
    const x = t();
    if (x.status === 'running') {
      if (Date.now() >= x.endsAt) complete(x.endsAt);
      else scheduleChime();
    }
  }

  /* ---------- Ton ---------- */
  function ensureAudio() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch { audio = null; }
    return audio;
  }

  function chime(kind, when) {
    const ctx = audio;
    if (!ctx || !S().sound) return [];
    const at = when ?? ctx.currentTime + 0.02;
    const vol = U.clamp(S().volume ?? 0.7, 0, 1);
    const notes = kind === 'focusEnd' ? [987.8, 784, 659.3] : kind === 'breakEnd' ? [659.3, 784, 987.8] : [784, 987.8];
    const nodes = [];
    notes.forEach((f, i) => {
      const t0 = at + i * 0.24;
      [1, 2.76].forEach((mult, k) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = f * mult;
        const peak = (k === 0 ? 0.32 : 0.07) * vol + 0.0001;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + (k === 0 ? 1.3 : 0.5));
        o.connect(g).connect(ctx.destination);
        o.start(t0);
        o.stop(t0 + 1.4);
        nodes.push(o);
      });
    });
    return nodes;
  }

  /** Ton im Voraus auf das Ende planen: klingt pünktlich, auch wenn der Tab gedrosselt wird */
  function scheduleChime() {
    cancelChime();
    const x = t();
    if (!audio || !S().sound || x.status !== 'running') return;
    const delay = Math.max(0, (x.endsAt - Date.now()) / 1000);
    chimeNodes = chime(x.phase === 'focus' ? 'focusEnd' : 'breakEnd', audio.currentTime + delay);
    chimeAt = x.endsAt;
  }
  function cancelChime() {
    chimeNodes.forEach((n) => { try { n.stop(); } catch { /* schon gestoppt */ } });
    chimeNodes = []; chimeAt = null;
  }
  function testSound() { ensureAudio(); setTimeout(() => chime('focusEnd'), 30); }

  /* ---------- Benachrichtigung ---------- */
  function notify(title, body) {
    try {
      if (!S().notify || !('Notification' in window) || Notification.permission !== 'granted') return;
      if (!document.hidden && !App.pipOpen()) return;
      const opts = { body, tag: 'pomodoro', renotify: true, icon: 'icons/icon-192.png' };
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then((reg) => reg.showNotification(title, opts)).catch(() => {});
      } else new Notification(title, opts);
    } catch { /* nicht verfügbar */ }
  }
  async function requestNotify() {
    try {
      if (!('Notification' in window)) return 'unsupported';
      if (Notification.permission === 'granted') return 'granted';
      return await Notification.requestPermission();
    } catch { return 'denied'; }
  }

  /* ---------- Bildschirm wach halten ---------- */
  async function requestWake() {
    try {
      if (!S().wakeLock || !('wakeLock' in navigator) || wakeLock || document.hidden) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch { wakeLock = null; }
  }
  function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch { /* egal */ } wakeLock = null; }

  /* ---------- Hintergrund-Modus / Medien-Steuerung ----------
   * Spielt eine stumme Tonspur, solange der Timer läuft. So bleibt die App
   * auf Android im Hintergrund aktiv (Signalton kommt pünktlich) und der
   * Timer erscheint mit Start/Pause in der Benachrichtigung bzw. in den
   * Medien-Steuerelementen des Browsers. */
  function silentWavUrl() {
    const rate = 8000; const secs = 10; const n = rate * secs;
    const buf = new ArrayBuffer(44 + n);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }

  function setupMediaHandlers() {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const h = (a, fn) => { try { ms.setActionHandler(a, fn); } catch { /* nicht unterstützt */ } };
    h('play', () => start());
    h('pause', () => pause());
    h('stop', () => pause());
    h('nexttrack', () => { if (t().phase === 'focus') finishEarly(); else skip(); });
  }

  function syncMedia(force) {
    const want = !!S().background && isRunning();
    try {
      if (want) {
        if (!bgAudio) {
          bgAudio = new Audio(silentWavUrl());
          bgAudio.loop = true;
          setupMediaHandlers();
        }
        if (bgAudio.paused) bgAudio.play().catch(() => {});
      } else if (bgAudio && !bgAudio.paused) {
        bgAudio.pause();
      }
      if (!('mediaSession' in navigator) || !bgAudio) return;
      const ms = navigator.mediaSession;
      const minute = Math.ceil(remaining() / 60);
      if (!force && minute === lastMediaMinute) return;
      lastMediaMinute = minute;
      if (!S().background) { ms.metadata = null; ms.playbackState = 'none'; return; }
      const x = t();
      const tg = Store.resolveTarget(x.target);
      ms.metadata = new MediaMetadata({
        title: `${PHASES[x.phase].label} · noch ${minute} min`,
        artist: x.phase === 'focus' ? tg.title : 'Pomodoro-Planer',
        album: 'Pomodoro-Planer',
      });
      ms.playbackState = isRunning() ? 'playing' : 'paused';
      if (ms.setPositionState && isActive()) {
        const d = duration();
        ms.setPositionState({ duration: d, playbackRate: 1, position: U.clamp(d - remaining(), 0, d) });
      }
    } catch { /* Medien-API nicht verfügbar */ }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { tick(); if (isRunning()) requestWake(); }
  });
  document.addEventListener('pointerdown', () => { if (audio && audio.state === 'suspended') audio.resume(); }, { passive: true });

  return {
    PHASES, durationOf, duration, remaining, elapsedFocus, isRunning, isActive, start, pause, toggle, adjust,
    setPhase, reset, finishEarly, skip, tick, resume, testSound, requestNotify, ensureAudio, syncMedia,
    scheduleChime,
  };
})();

/* js/ui.js */
/* Gemeinsame UI-Bausteine: Icons, Dialoge, Toasts, Tooltip, Datei-Download,
 * wiederverwendbare Render-Helfer (Aufgabenzeile, Chips, Zifferblatt, Maskottchen). */
'use strict';

const Views = {};

const UI = (() => {
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = U.esc;
  const icon = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;

  /* ---------- Dialoge ---------- */
  let onCloseCb = null;
  let cancelBound = false;
  const fireClose = () => { const cb = onCloseCb; onCloseCb = null; if (cb) cb(); };
  function openDialog({ title, body, footer, wide = false, onOpen, onSubmit }) {
    const dlg = $('#dlg');
    if (!cancelBound) { cancelBound = true; dlg.addEventListener('cancel', fireClose); }
    if (dlg.open) closeDialog();
    dlg.className = `dlg${wide ? ' dlg-wide' : ''}`;
    dlg.innerHTML = `<form class="dlg-form" method="dialog">
      <header class="dlg-head"><h2>${esc(title)}</h2>
        <button type="button" class="icon-btn" data-close aria-label="Schliessen">${icon('x')}</button></header>
      <div class="dlg-body">${body}</div>
      <footer class="dlg-foot">${footer}</footer></form>`;
    const form = dlg.querySelector('form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!onSubmit) return;
      const res = onSubmit(new FormData(form), form, e.submitter);
      if (res !== false) closeDialog();
    });
    dlg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => closeDialog()));
    if (onOpen) onOpen(form, dlg);
    dlg.showModal();
    const first = form.querySelector('[autofocus]');
    if (first && !U.isTouch) first.focus();
    return dlg;
  }
  /** Schliesst den Dialog; der Abbruch-Callback läuft synchron (kein verspätetes close-Ereignis) */
  function closeDialog() {
    const dlg = $('#dlg');
    fireClose();
    if (dlg.open) dlg.close();
  }

  /** Formular-Dialog */
  function form({ title, body, submitLabel = 'Speichern', danger = false, wide = false, extraFooter = '', onSubmit, onOpen }) {
    return openDialog({
      title, body, wide, onOpen, onSubmit,
      footer: `${extraFooter}<span class="grow"></span>
        <button type="button" class="btn btn-ghost" data-close>Abbrechen</button>
        <button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}">${esc(submitLabel)}</button>`,
    });
  }

  /** Auswahl-Dialog → Promise mit value oder null */
  function choice({ title, text, buttons }) {
    return new Promise((resolve) => {
      let done = false;
      openDialog({
        title,
        body: `<p class="dlg-text">${esc(text)}</p>`,
        footer: `<span class="grow"></span>${buttons.map((b, i) => `<button type="button" class="btn ${b.kind || 'btn-ghost'}" data-choice="${i}">${esc(b.label)}</button>`).join('')}`,
        onOpen(f) {
          f.querySelectorAll('[data-choice]').forEach((el) => el.addEventListener('click', () => {
            done = true; resolve(buttons[+el.dataset.choice].value); closeDialog();
          }));
        },
      });
      onCloseCb = () => { if (!done) resolve(null); };
    });
  }
  const confirm = (text, { title = 'Bist du sicher?', ok = 'OK', danger = false } = {}) =>
    choice({ title, text, buttons: [{ label: 'Abbrechen', value: false }, { label: ok, value: true, kind: danger ? 'btn-danger' : 'btn-primary' }] })
      .then((v) => v === true);

  /* ---------- Toasts ---------- */
  function toast(msg, { action, timeout = 4500 } = {}) {
    const host = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    const span = document.createElement('span');
    span.textContent = msg;
    el.append(span);
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'toast-btn';
      b.textContent = action.label;
      b.addEventListener('click', () => { action.fn(); el.remove(); });
      el.append(b);
    }
    host.append(el);
    setTimeout(() => el.classList.add('is-out'), timeout);
    setTimeout(() => el.remove(), timeout + 350);
  }

  /* ---------- Tooltip (Diagramme) ---------- */
  function showTip(target, build) {
    const tip = $('#tip');
    tip.replaceChildren();
    build(tip);
    tip.hidden = false;
    const r = target.getBoundingClientRect();
    const tw = tip.offsetWidth; const th = tip.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2;
    x = U.clamp(x, 8, window.innerWidth - tw - 8);
    let y = r.top - th - 10;
    if (y < 8) y = r.bottom + 10;
    tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  }
  const hideTip = () => { $('#tip').hidden = true; };

  /* ---------- Dateien & Zwischenablage ---------- */
  async function saveFile(filename, data, mime = 'application/octet-stream') {
    if (window.claude && typeof window.claude.use === 'function') {
      let dl = null;
      try { dl = await window.claude.use('downloads'); } catch { dl = null; }
      if (dl) {
        try { await dl.save({ filename, data }); return true; } catch (e) {
          if (e && e.code === 'declined') return false;
          toast('Download ist in dieser Ansicht nicht möglich.');
          return false;
        }
      }
    }
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  }
  function copy(text, selectEl) {
    const fallback = () => {
      if (!selectEl) { toast('Kopieren ist hier nicht möglich.'); return; }
      const r = document.createRange();
      r.selectNodeContents(selectEl);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast('Text markiert – mit Strg+C kopieren');
    };
    try {
      navigator.clipboard.writeText(text).then(() => toast('In die Zwischenablage kopiert'), fallback);
    } catch { fallback(); }
  }
  function pickFile(accept) {
    return new Promise((resolve) => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = accept;
      inp.addEventListener('change', () => resolve(inp.files && inp.files[0] ? inp.files[0] : null));
      inp.click();
    });
  }

  /* ---------- Render-Helfer ---------- */
  const projChip = (p) => (p ? `<span class="pchip" style="--pc: var(--pc-${p.color || 1})"><i></i>${esc(p.name)}</span>` : '');
  const catChip = (c) => `<span class="cchip" style="--cc: var(--cat-${c})"><i></i>${esc(CATS[c]?.label || c)}</span>`;

  function pomoDots(done, est) {
    const max = 8;
    const total = Math.max(est, done);
    const shown = Math.min(total, max);
    let s = '';
    for (let i = 0; i < shown; i++) s += `<i class="${i < done ? (i >= est ? 'is-over' : 'is-on') : ''}"></i>`;
    if (total > max) s += `<b>+${total - max}</b>`;
    return `<span class="pdots" title="${done} von ${est} Pomodoros" aria-label="${done} von ${est} Pomodoros">${s}</span>`;
  }

  function taskRow(t, { showDate = true, showProject = true, draggable = false } = {}) {
    const st = Store.taskStats(t.id);
    const p = Store.project(t.projectId);
    const isTarget = Store.state.timer.target === `t:${t.id}`;
    const overdue = !t.done && t.date && t.date < U.todayKey();
    const meta = [];
    if (showProject && p) meta.push(projChip(p));
    if (showDate && t.date) meta.push(`<span class="meta ${overdue ? 'is-overdue' : ''}">${icon('calendar')}${overdue ? 'überfällig · ' : ''}${U.relDay(t.date)}${t.time ? ` · ${t.time}` : ''}</span>`);
    else if (t.time) meta.push(`<span class="meta">${icon('clock')}${t.time}</span>`);
    if (st.sec) meta.push(`<span class="meta">${icon('timer')}${U.fmtDur(st.sec)}</span>`);
    return `<li class="task${t.done ? ' is-done' : ''}${isTarget ? ' is-target' : ''}" data-task="${t.id}"${draggable ? ' draggable="true"' : ''}>
      <label class="check"><input type="checkbox" data-change="taskDone" data-id="${t.id}"${t.done ? ' checked' : ''}><span class="check-box" aria-hidden="true">${icon('check')}</span><span class="sr-only">Erledigt: ${esc(t.title)}</span></label>
      <button type="button" class="task-main" data-act="editTask" data-id="${t.id}"><span class="task-title">${esc(t.title)}</span>${meta.length ? `<span class="task-meta">${meta.join('')}</span>` : ''}</button>
      ${pomoDots(st.pomos, t.estimate || 1)}
      ${t.done ? '<span class="play-gap"></span>' : `<button type="button" class="icon-btn play-btn${isTarget ? ' is-on' : ''}" data-act="focusTask" data-id="${t.id}" title="Mit dieser Aufgabe fokussieren" aria-label="Fokussieren: ${esc(t.title)}">${icon('play')}</button>`}
    </li>`;
  }

  function projectOptions(sel, none = 'Ohne Projekt') {
    return `<option value="">${esc(none)}</option>${Store.projects().map((p) => `<option value="${p.id}"${p.id === sel ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}`;
  }

  function targetOptions(sel) {
    const today = U.todayKey();
    const open = Store.state.tasks.filter((t) => !t.done);
    const todays = open.filter((t) => t.date && t.date <= today).sort(taskSort);
    const others = open.filter((t) => !(t.date && t.date <= today))
      .sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
    const opt = (v, label) => `<option value="${v}"${v === sel ? ' selected' : ''}>${esc(label)}</option>`;
    const tl = (t) => { const p = Store.project(t.projectId); return p ? `${t.title} · ${p.name}` : t.title; };
    let h = opt('', 'Ohne Zuordnung');
    if (sel && sel.startsWith('t:') && !open.some((t) => `t:${t.id}` === sel)) {
      const t = Store.task(sel.slice(2));
      if (t) h += opt(sel, `${tl(t)} (erledigt)`);
    }
    if (todays.length) h += `<optgroup label="Für heute geplant">${todays.map((t) => opt(`t:${t.id}`, tl(t))).join('')}</optgroup>`;
    if (others.length) h += `<optgroup label="Weitere offene Aufgaben">${others.map((t) => opt(`t:${t.id}`, tl(t))).join('')}</optgroup>`;
    const ps = Store.projects();
    if (ps.length) h += `<optgroup label="Nur Projekt">${ps.map((p) => opt(`p:${p.id}`, p.name)).join('')}</optgroup>`;
    h += `<optgroup label="Nur Kategorie">${CAT_KEYS.map((c) => opt(`c:${c}`, CATS[c].label)).join('')}</optgroup>`;
    return h;
  }

  /* Zifferblatt wie bei einer Küchenuhr: 60 Striche, Bogen = verbleibender Anteil */
  let ticksCache = '';
  function dial(prefix = '') {
    if (!ticksCache) {
      for (let i = 0; i < 60; i++) {
        const a = (i * 6 * Math.PI) / 180;
        const major = i % 5 === 0;
        const r1 = 152; const r2 = major ? 140 : 146;
        const p = (r) => `${(160 + r * Math.sin(a)).toFixed(1)} ${(160 - r * Math.cos(a)).toFixed(1)}`;
        const [x1, y1] = p(r1).split(' '); const [x2, y2] = p(r2).split(' ');
        ticksCache += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${major ? 'tk tk-major' : 'tk'}"></line>`;
      }
    }
    const C = (2 * Math.PI * 126).toFixed(2);
    return `<svg class="dial" viewBox="0 0 320 320" aria-hidden="true">
      <g class="dial-ticks">${ticksCache}</g>
      <circle class="dial-track" cx="160" cy="160" r="126"></circle>
      <circle class="dial-arc" id="${prefix}arc" cx="160" cy="160" r="126" stroke-dasharray="${C}" stroke-dashoffset="0" transform="rotate(-90 160 160)"></circle>
      <circle class="dial-knob" id="${prefix}knob" cx="160" cy="34" r="8"></circle>
    </svg>`;
  }
  function updateDial(root, frac, prefix = '') {
    const arc = root.getElementById ? root.getElementById(`${prefix}arc`) : root.querySelector(`#${prefix}arc`);
    const knob = root.getElementById ? root.getElementById(`${prefix}knob`) : root.querySelector(`#${prefix}knob`);
    if (!arc) return;
    const C = 2 * Math.PI * 126;
    const f = U.clamp(frac, 0, 1);
    arc.setAttribute('stroke-dashoffset', (C * (1 - f)).toFixed(2));
    if (knob) {
      const th = (f * 360 - 90) * (Math.PI / 180);
      knob.setAttribute('cx', (160 + 126 * Math.cos(th)).toFixed(2));
      knob.setAttribute('cy', (160 + 126 * Math.sin(th)).toFixed(2));
    }
  }

  /* Maskottchen für den Anime-Stil: Tomaten-Chan */
  function mascot(mood) {
    const eyes = {
      idle: '<ellipse cx="45" cy="66" rx="6.5" ry="8.5" class="m-ink"/><ellipse cx="75" cy="66" rx="6.5" ry="8.5" class="m-ink"/><circle cx="47.5" cy="62.5" r="2.6" class="m-white"/><circle cx="77.5" cy="62.5" r="2.6" class="m-white"/>',
      focus: '<ellipse cx="45" cy="67" rx="6.5" ry="7.5" class="m-ink"/><ellipse cx="75" cy="67" rx="6.5" ry="7.5" class="m-ink"/><circle cx="47.5" cy="64" r="2.4" class="m-white"/><circle cx="77.5" cy="64" r="2.4" class="m-white"/><path d="M36 53 L53 58 M84 53 L67 58" class="m-line"/>',
      paused: '<path d="M38 67 h13 M69 67 h13" class="m-line"/>',
      break: '<path d="M38 69 q6.5 -9 13 0 M69 69 q6.5 -9 13 0" class="m-line"/>',
      yay: '<path d="M45 58 l2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 6 -2.2z M75 58 l2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 6 -2.2z" class="m-ink"/>',
    };
    const mouth = {
      idle: '<path d="M53 80 q7 7 14 0" class="m-line"/>',
      focus: '<path d="M54 83 q6 -3 12 0" class="m-line"/>',
      paused: '<ellipse cx="60" cy="83" rx="3.5" ry="4" class="m-ink"/>',
      break: '<path d="M51 79 q9 12 18 0 z" class="m-mouth"/>',
      yay: '<path d="M49 78 q11 15 22 0 z" class="m-mouth"/>',
    };
    const extra = {
      paused: '<text x="92" y="34" class="m-zzz">z</text><text x="101" y="24" class="m-zzz m-zzz-2">z</text>',
      yay: '<path d="M14 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z M104 82 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" class="m-spark"/>',
      focus: '<path d="M98 50 q6 4 3 12 q-5 -2 -3 -12z" class="m-sweat"/>',
    };
    const m = eyes[mood] ? mood : 'idle';
    return `<svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
      <ellipse cx="60" cy="70" rx="44" ry="39" class="m-body"/>
      <ellipse cx="42" cy="50" rx="10" ry="6" class="m-shine" transform="rotate(-25 42 50)"/>
      <path d="M60 22 l7 10 12 -4 -6 11 11 6 -13 2 -11 0 -13 -2 11 -6 -6 -11 12 4z" class="m-leaf"/>
      <path d="M60 22 q2 -8 7 -11" class="m-stem"/>
      <ellipse cx="34" cy="80" rx="7" ry="4" class="m-blush"/><ellipse cx="86" cy="80" rx="7" ry="4" class="m-blush"/>
      ${eyes[m]}${mouth[m]}${extra[m] || ''}
    </svg>`;
  }

  return {
    $, icon, openDialog, closeDialog, form, choice, confirm, toast, showTip, hideTip, saveFile, copy, pickFile,
    projChip, catChip, pomoDots, taskRow, projectOptions, targetOptions, dial, updateDial, mascot,
  };
})();

/* js/charts.js */
/* Säulendiagramm (gestapelt) in HTML/CSS mit Tooltip – skaliert mit dem Container */
'use strict';

const Charts = (() => {
  const data = {};
  const STEPS = [5, 10, 15, 30, 60, 120, 180, 240, 360, 480, 720, 1440, 2880, 6000, 12000, 30000].map((m) => m * 60);

  const niceStep = (max) => STEPS.find((s) => max / s <= 4) || STEPS[STEPS.length - 1];
  const tickLabel = (sec) => (sec === 0 ? '0' : sec < 3600 ? `${sec / 60} min` : `${+(sec / 3600).toFixed(1)} h`);

  /**
   * buckets: [{label, sub, values: {seriesKey: sec}}]
   * series:  [{key, label, color}]
   */
  function columns({ id, buckets, series, legend = true, labelEvery = 1 }) {
    const totals = buckets.map((b) => U.sum(series, (s) => b.values[s.key] || 0));
    const max = Math.max(0, ...totals);
    const step = niceStep(max || 3600);
    const top = Math.max(step, Math.ceil(max / step) * step);
    data[id] = { buckets, series, totals };
    const ticks = [];
    for (let v = 0; v <= top + 1; v += step) ticks.push(v);
    const grid = ticks.map((v) => `<div class="cg-line${v === 0 ? ' is-base' : ''}" style="bottom:${((v / top) * 100).toFixed(2)}%"><span>${tickLabel(v)}</span></div>`).join('');
    const cols = buckets.map((b, i) => {
      const tot = totals[i];
      const segs = series.filter((s) => (b.values[s.key] || 0) > 0)
        .map((s) => `<i style="flex-grow:${b.values[s.key]};background:${s.color}"></i>`).join('');
      return `<div class="cc" data-chart="${id}" data-i="${i}" tabindex="0" aria-label="${U.esc(b.sub || b.label)}: ${U.fmtDur(tot)}">
        <div class="cc-bar" style="height:${((tot / top) * 100).toFixed(2)}%">${segs}</div></div>`;
    }).join('');
    const xl = buckets.map((b, i) => `<span>${i % labelEvery === 0 ? U.esc(b.label) : ''}</span>`).join('');
    const leg = legend
      ? `<div class="legend">${series.filter((s) => U.sum(buckets, (b) => b.values[s.key] || 0) > 0).map((s) => `<span class="lg"><i style="background:${s.color}"></i>${U.esc(s.label)} <b class="mono">${U.fmtHM(U.sum(buckets, (b) => b.values[s.key] || 0))}</b></span>`).join('')}</div>`
      : '';
    return `${leg}<div class="chart" style="--n:${buckets.length}">
      <div class="chart-plot">${grid}<div class="chart-cols">${cols}</div></div>
      <div class="chart-x">${xl}</div></div>`;
  }

  function tipFor(el) {
    const d = data[el.dataset.chart];
    if (!d) return;
    const i = +el.dataset.i;
    const b = d.buckets[i];
    UI.showTip(el, (tip) => {
      const h = document.createElement('div');
      h.className = 'tip-title';
      h.textContent = b.sub || b.label;
      const tot = document.createElement('div');
      tot.className = 'tip-total';
      tot.textContent = U.fmtDur(d.totals[i]);
      tip.append(h, tot);
      if (d.series.length > 1) {
        d.series.forEach((s) => {
          const v = b.values[s.key] || 0;
          if (!v) return;
          const row = document.createElement('div');
          row.className = 'tip-row';
          const key = document.createElement('i');
          key.style.background = s.color;
          const val = document.createElement('b');
          val.textContent = U.fmtHM(v);
          const lab = document.createElement('span');
          lab.textContent = s.label;
          row.append(key, val, lab);
          tip.append(row);
        });
      }
    });
  }

  const onOver = (e) => { const el = e.target.closest && e.target.closest('.cc'); if (el) tipFor(el); };
  const onOut = (e) => { const el = e.target.closest && e.target.closest('.cc'); if (el) UI.hideTip(); };
  document.addEventListener('pointerover', onOver);
  document.addEventListener('pointerout', onOut);
  document.addEventListener('focusin', onOver);
  document.addEventListener('focusout', onOut);
  window.addEventListener('scroll', () => UI.hideTip(), { passive: true });

  return { columns, data };
})();

/* js/views/fokus.js */
/* Ansicht «Fokus»: Timer, aktuelle Aufgabe, heutige Aufgaben */
'use strict';

Views.fokus = {
  title: 'Fokus',
  render() {
    const st = Store.state;
    const x = st.timer;
    const set = st.settings;
    const { icon, esc } = { icon: UI.icon, esc: U.esc };
    const running = x.status === 'running';
    const active = x.status !== 'idle';
    const every = Math.max(1, set.longEvery || 4);
    const inRound = (x.cycle || 0) % every;
    const dots = Array.from({ length: every }, (_, i) => {
      const cls = i < inRound ? 'is-on' : i === inRound && x.phase === 'focus' ? 'is-now' : '';
      return `<i class="${cls}"></i>`;
    }).join('');
    const roundText = x.phase === 'focus'
      ? `Runde ${inRound + 1} von ${every}`
      : x.phase === 'long' ? 'Lange Pause verdient' : `Noch ${every - inRound} bis zur langen Pause`;

    const tg = Store.resolveTarget(x.target);
    const tStats = tg.taskId ? Store.taskStats(tg.taskId) : null;

    const today = U.todayKey();
    const todays = st.tasks.filter((t) => (t.date === today) || (!t.done && t.date && t.date < today)).sort((a, b) => {
      const oa = a.date < today ? 0 : 1; const ob = b.date < today ? 0 : 1;
      return oa - ob || taskSort(a, b);
    });
    const d0 = U.startOfDay(new Date());
    const daySessions = Store.sessionsBetween(d0, U.addDays(d0, 1));
    const daySec = U.sum(daySessions, (s) => s.sec);
    const dayPomos = daySessions.filter((s) => s.full).length;
    const byCat = CAT_KEYS.map((c) => [c, U.sum(daySessions.filter((s) => Store.sessionCat(s) === c), (s) => s.sec)]).filter(([, v]) => v > 0);
    const goal = (set.dailyGoalMin || 0) * 60;
    const goalPct = goal ? U.clamp(daySec / goal, 0, 1) : 0;
    const streak = Store.streak();

    const presetChips = (set.presets || []).map((p) => {
      const on = p.focus === set.focus && p.short === set.short && p.long === set.long && p.longEvery === set.longEvery;
      return `<button type="button" class="chip${on ? ' is-on' : ''}" data-act="applyPreset" data-id="${esc(p.id)}" aria-pressed="${on}">
        <b>${esc(p.name)}</b><span class="mono">${p.focus}·${p.short}·${p.long}</span></button>`;
    }).join('');

    const isAnime = document.documentElement.dataset.skin === 'anime';
    const mood = running ? (x.phase === 'focus' ? 'focus' : 'break') : active ? 'paused' : (App.flashMood || 'idle');
    const lines = {
      focus: ['Konzentration! 集中', 'Du schaffst das!', 'Nur noch diese Runde!'],
      break: ['Pause! Tee trinken~', 'Kurz strecken!', 'Augen entspannen ✿'],
      paused: ['Kurz verschnaufen …', 'Weiter mit Leertaste!'],
      idle: ['Bereit? Leertaste drücken!', 'Los geht’s!'],
      yay: ['Yatta! Geschafft! ✦', 'Super gemacht!'],
    };
    const say = lines[mood][(x.cycle || 0) % lines[mood].length];

    return `
    <div class="view-head">
      <div><p class="eyebrow">${U.fmtDayLong(new Date())}</p><h1>Fokus</h1></div>
      <div class="head-actions">
        <button type="button" class="btn btn-ghost" data-act="minimize" title="Minimieren (M)">${icon('minimize')}<span>Minimieren</span></button>
      </div>
    </div>
    <section class="focus-grid" data-phase="${x.phase}">
      <div class="card timer-card">
        ${isAnime ? '<div class="speedlines" aria-hidden="true"></div><div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>' : ''}
        <div class="phase-tabs" role="tablist" aria-label="Phase">
          ${['focus', 'short', 'long'].map((p) => `<button type="button" role="tab" class="phase-tab${p === x.phase ? ' is-on' : ''}" aria-selected="${p === x.phase}" data-act="phase" data-phase="${p}">
            ${PHASES[p].label}<span class="mono">${set[p]} min</span></button>`).join('')}
        </div>
        <div class="dial-wrap${running ? ' is-running' : ''}">
          ${UI.dial()}
          <div class="dial-center">
            ${isAnime ? `<span class="kanji" aria-hidden="true">${PHASES[x.phase].kanji}</span>` : ''}
            <div class="clock mono" data-clock role="timer" aria-live="off">${U.fmtClock(Timer.remaining())}</div>
            <div class="dial-sub">${running ? PHASES[x.phase].label : active ? 'Pausiert' : 'Bereit'}</div>
          </div>
        </div>
        ${isAnime ? `<div class="mascot-wrap">${UI.mascot(mood)}<p class="bubble">${esc(say)}</p></div>` : ''}
        <div class="round"><span class="round-dots" aria-hidden="true">${dots}</span><span>${roundText}</span></div>
        <div class="controls">
          <button type="button" class="btn-round" data-act="adjust" data-min="-5" aria-label="5 Minuten weniger" title="5 Minuten weniger">−5</button>
          <button type="button" class="btn-start" data-act="toggle" aria-keyshortcuts="Space">
            ${icon(running ? 'pause' : 'play')}<span>${running ? 'Pause' : active ? 'Weiter' : 'Start'}</span></button>
          <button type="button" class="btn-round" data-act="adjust" data-min="5" aria-label="5 Minuten mehr" title="5 Minuten mehr">+5</button>
        </div>
        <div class="controls-2">
          ${x.phase === 'focus' && active ? `<button type="button" class="btn btn-ghost" data-act="finish" title="Taste F">${icon('check')}Fertig &amp; speichern</button>` : ''}
          ${x.phase !== 'focus' ? `<button type="button" class="btn btn-ghost" data-act="skip" title="Taste S">${icon('skip')}Pause überspringen</button>` : ''}
          ${active ? `<button type="button" class="btn btn-ghost" data-act="reset">${icon('reset')}Zurücksetzen</button>` : ''}
          <span class="kbd-hint"><kbd>Leertaste</kbd> Start/Pause</span>
        </div>
        <div class="presets" role="group" aria-label="Vorlagen">${presetChips}
          <button type="button" class="chip chip-link" data-act="go" data-view="einstellungen">${icon('sliders')}Anpassen</button>
        </div>
      </div>

      <div class="focus-side">
        <div class="card target-card">
          <label class="label" for="targetSel">Woran arbeitest du?</label>
          <select id="targetSel" data-change="target">${UI.targetOptions(x.target)}</select>
          <div class="target-info">
            ${tg.project ? UI.projChip(tg.project) : ''}${UI.catChip(tg.category)}
            ${tStats ? `<span class="target-progress">${UI.pomoDots(tStats.pomos, tg.task.estimate || 1)}<span class="muted">${U.fmtDur(tStats.sec)}</span></span>` : ''}
            ${tg.task && !tg.task.done ? `<button type="button" class="btn btn-ghost btn-sm" data-act="doneTarget">${icon('check')}Erledigt</button>` : ''}
          </div>
        </div>

        <div class="card today-card">
          <div class="card-head">
            <h2>Heute</h2>
            <span class="muted">${streak > 1 ? `${streak} Tage in Folge` : ''}</span>
          </div>
          <div class="today-sum">
            <div class="today-big"><span class="big-num">${U.fmtDur(daySec)}</span><span class="muted"> fokussiert · ${dayPomos} Pomodoro${dayPomos === 1 ? '' : 's'}</span></div>
            ${goal ? `<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${Math.round(daySec)}" aria-label="Tagesziel"><i style="width:${(goalPct * 100).toFixed(1)}%"></i></div>
            <div class="meter-label muted"><span>Tagesziel ${U.fmtDur(goal)}</span><span>${U.pct(daySec, goal)} %</span></div>` : ''}
            ${byCat.length ? `<div class="cat-line">${byCat.map(([c, v]) => `<span>${UI.catChip(c)} <span class="mono">${U.fmtHM(v)}</span></span>`).join('')}</div>` : ''}
          </div>
          ${todays.length ? `<ul class="task-list">${todays.map((t) => UI.taskRow(t, { showDate: t.date !== today })).join('')}</ul>`
            : `<p class="empty-line">Für heute ist nichts geplant. Füge unten eine Aufgabe hinzu oder plane im <button type="button" class="link" data-act="go" data-view="kalender">Kalender</button>.</p>`}
          <form class="quick-add" data-form="quickTask" autocomplete="off">
            <input type="hidden" name="date" value="${today}">
            <label class="sr-only" for="qtTitle">Neue Aufgabe für heute</label>
            <input id="qtTitle" name="title" data-keep placeholder="Aufgabe für heute …" required maxlength="140">
            <label class="sr-only" for="qtProject">Projekt</label>
            <select id="qtProject" name="projectId" data-keep>${UI.projectOptions(App.ui.lastProject || '')}</select>
            <label class="sr-only" for="qtEst">Geschätzte Pomodoros</label>
            <input id="qtEst" name="estimate" data-keep type="number" min="1" max="20" value="1" inputmode="numeric" title="Geschätzte Pomodoros">
            <button type="submit" class="icon-btn icon-btn-solid" aria-label="Hinzufügen">${icon('plus')}</button>
          </form>
        </div>
      </div>
    </section>`;
  },
};

/* js/views/aufgaben.js */
/* Ansicht «Aufgaben»: alle Aufgaben mit Filtern, gruppiert nach Datum */
'use strict';

Views.aufgaben = {
  title: 'Aufgaben',
  render() {
    const f = App.ui.taskFilter;
    const today = U.todayKey();
    const weekEnd = U.dateKey(U.addDays(U.startOfWeek(new Date()), 6));
    let list = Store.state.tasks.slice();
    if (f.status === 'open') list = list.filter((t) => !t.done);
    if (f.status === 'done') list = list.filter((t) => t.done);
    if (f.project === 'none') list = list.filter((t) => !t.projectId);
    else if (f.project !== 'all') list = list.filter((t) => t.projectId === f.project);
    if (f.when === 'today') list = list.filter((t) => t.date === today || (!t.done && t.date && t.date < today));
    if (f.when === 'week') list = list.filter((t) => t.date && t.date >= today && t.date <= weekEnd);
    if (f.when === 'overdue') list = list.filter((t) => !t.done && t.date && t.date < today);
    if (f.when === 'unplanned') list = list.filter((t) => !t.date);
    const q = (f.q || '').trim().toLowerCase();
    if (q) list = list.filter((t) => t.title.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q));

    const groups = new Map();
    const add = (k, t) => { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); };
    list.forEach((t) => {
      if (!t.date) add('~none', t);
      else if (!t.done && t.date < today) add('!overdue', t);
      else add(t.date, t);
    });
    const keys = [...groups.keys()].sort((a, b) => {
      const rank = (k) => (k === '!overdue' ? 0 : k === '~none' ? 2 : 1);
      return rank(a) - rank(b) || (f.status === 'done' ? b.localeCompare(a) : a.localeCompare(b));
    });
    const label = (k) => {
      if (k === '!overdue') return 'Überfällig';
      if (k === '~none') return 'Ohne Datum';
      const rel = U.relDay(k);
      return rel.includes(',') ? U.fmtDayLong(k) : `${rel} · ${U.fmtDay(k)}`;
    };
    const seg = (name, val, text) => `<button type="button" class="seg-btn${f[name] === val ? ' is-on' : ''}" aria-pressed="${f[name] === val}" data-act="taskFilter" data-k="${name}" data-v="${val}">${text}</button>`;
    const projOpts = `<option value="all"${f.project === 'all' ? ' selected' : ''}>Alle Projekte</option><option value="none"${f.project === 'none' ? ' selected' : ''}>Ohne Projekt</option>${Store.projects().map((p) => `<option value="${p.id}"${f.project === p.id ? ' selected' : ''}>${U.esc(p.name)}</option>`).join('')}`;
    const totalOpen = Store.state.tasks.filter((t) => !t.done).length;

    return `
    <div class="view-head">
      <div><p class="eyebrow">${totalOpen} offen</p><h1>Aufgaben</h1></div>
    </div>
    <form class="card add-task" data-form="newTask" autocomplete="off">
      <label class="sr-only" for="ntTitle">Neue Aufgabe</label>
      <input id="ntTitle" name="title" data-keep placeholder="Neue Aufgabe …" required maxlength="140" class="grow-input">
      <label class="field-inline"><span>Projekt</span><select id="ntProject" name="projectId" data-keep>${UI.projectOptions(f.project !== 'all' && f.project !== 'none' ? f.project : (App.ui.lastProject || ''))}</select></label>
      <label class="field-inline"><span>Pomodoros</span><input id="ntEst" name="estimate" data-keep type="number" min="1" max="20" value="1" inputmode="numeric"></label>
      <label class="field-inline"><span>Datum</span><input id="ntDate" name="date" data-keep type="date"></label>
      <button type="submit" class="btn btn-primary">${UI.icon('plus')}Hinzufügen</button>
    </form>
    <div class="filters">
      <div class="seg" role="group" aria-label="Status">${seg('status', 'open', 'Offen')}${seg('status', 'done', 'Erledigt')}${seg('status', 'all', 'Alle')}</div>
      <div class="seg" role="group" aria-label="Zeitraum">${seg('when', 'all', 'Alle')}${seg('when', 'today', 'Heute')}${seg('when', 'week', 'Diese Woche')}${seg('when', 'overdue', 'Überfällig')}${seg('when', 'unplanned', 'Ungeplant')}</div>
      <label class="sr-only" for="tfProject">Projekt</label>
      <select id="tfProject" data-change="taskFilterProject">${projOpts}</select>
      <label class="sr-only" for="tfSearch">Suchen</label>
      <input id="tfSearch" type="search" placeholder="Suchen …" value="${U.esc(f.q || '')}" data-input="taskSearch" data-keep>
    </div>
    ${keys.length ? keys.map((k) => `
      <section class="task-group${k === '!overdue' ? ' is-overdue' : ''}">
        <h2 class="group-title">${label(k)} <span class="muted">${groups.get(k).length}</span></h2>
        <ul class="task-list card">${groups.get(k).sort(taskSort).map((t) => UI.taskRow(t, { showDate: k === '!overdue' })).join('')}</ul>
      </section>`).join('')
      : `<div class="empty card">
          <h2>${Store.state.tasks.length ? 'Keine Aufgaben für diesen Filter' : 'Noch keine Aufgaben'}</h2>
          <p>${Store.state.tasks.length ? 'Passe die Filter an, um weitere Aufgaben zu sehen.' : 'Lege oben deine erste Aufgabe an. Schätze dazu, wie viele Pomodoros sie braucht.'}</p>
          ${Store.isEmpty() ? '<button type="button" class="btn btn-ghost" data-act="loadDemo">Beispieldaten ansehen</button>' : ''}
        </div>`}`;
  },
};

/** Dialog zum Bearbeiten/Anlegen einer Aufgabe */
function openTaskDialog(task, defaults = {}) {
  const t = task ? U.clone(task) : { id: U.uid('t'), title: '', projectId: App.ui.lastProject || null, estimate: 1, date: null, time: null, done: false, notes: '', ...defaults };
  const st = task ? Store.taskStats(task.id) : null;
  UI.form({
    title: task ? 'Aufgabe bearbeiten' : 'Neue Aufgabe',
    submitLabel: task ? 'Speichern' : 'Anlegen',
    body: `
      <div class="field"><label for="tdTitle">Titel</label><input id="tdTitle" name="title" required maxlength="140" value="${U.esc(t.title)}" autofocus></div>
      <div class="field-row">
        <div class="field"><label for="tdProject">Projekt</label><select id="tdProject" name="projectId">${UI.projectOptions(t.projectId)}</select></div>
        <div class="field field-s"><label for="tdEst">Pomodoros</label><input id="tdEst" name="estimate" type="number" min="1" max="40" inputmode="numeric" value="${t.estimate || 1}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="tdDate">Geplant am</label><input id="tdDate" name="date" type="date" value="${t.date || ''}"></div>
        <div class="field field-s"><label for="tdTime">Uhrzeit</label><input id="tdTime" name="time" type="time" value="${t.time || ''}"></div>
      </div>
      <div class="field"><label for="tdNotes">Notizen</label><textarea id="tdNotes" name="notes" rows="3" maxlength="2000">${U.esc(t.notes || '')}</textarea></div>
      <label class="switch"><input type="checkbox" name="done"${t.done ? ' checked' : ''}><span>Erledigt</span></label>
      ${st ? `<p class="muted small">Erfasst: ${U.fmtDur(st.sec)} · ${st.pomos} Pomodoro${st.pomos === 1 ? '' : 's'}</p>` : ''}`,
    extraFooter: task ? `<button type="button" class="btn btn-ghost btn-danger-text" data-act="deleteTask" data-id="${t.id}">${UI.icon('trash')}Löschen</button>` : '',
    onSubmit(fd) {
      t.title = String(fd.get('title') || '').trim();
      if (!t.title) return false;
      t.projectId = fd.get('projectId') || null;
      t.estimate = U.clamp(parseInt(fd.get('estimate'), 10) || 1, 1, 40);
      t.date = fd.get('date') || null;
      t.time = fd.get('time') || null;
      t.notes = String(fd.get('notes') || '');
      t.done = fd.get('done') === 'on';
      Store.saveTask(t);
      if (!task) UI.toast('Aufgabe angelegt');
      return true;
    },
  });
}

/* js/views/projekte.js */
/* Ansicht «Projekte»: Übersicht und Detail mit Zeit, Fortschritt, Aufgaben */
'use strict';

Views.projekte = {
  title: 'Projekte',
  render() {
    const pid = App.ui.projectId;
    if (pid && Store.project(pid)) return this.detail(Store.project(pid));
    const arch = App.ui.showArchived;
    const list = Store.projects(arch);
    const w0 = U.startOfWeek(new Date());
    const w1 = U.addDays(w0, 7);
    const cards = list.map((p) => {
      const all = Store.projectStats(p.id);
      const wk = Store.projectStats(p.id, w0, w1);
      const prog = progressOf(p, all);
      return `<button type="button" class="card project-card" data-act="openProject" data-id="${p.id}" style="--pc: var(--pc-${p.color || 1})">
        <span class="pc-top"><span class="pc-swatch"></span>${UI.catChip(p.category)}${deadlineBadge(p)}</span>
        <span class="pc-name">${U.esc(p.name)}</span>
        <span class="pc-stats">
          <span><b class="mono">${U.fmtHM(all.sec)}</b><small>gesamt</small></span>
          <span><b class="mono">${U.fmtHM(wk.sec)}</b><small>diese Woche</small></span>
          <span><b class="mono">${all.open}</b><small>offen</small></span>
        </span>
        <span class="pc-progress"><span class="meter meter-pc"><i style="width:${(prog.frac * 100).toFixed(1)}%"></i></span><small class="muted">${U.esc(prog.label)}</small></span>
      </button>`;
    }).join('');
    const nArch = Store.projects(true).length;
    return `
    <div class="view-head">
      <div><p class="eyebrow">${list.length} ${arch ? 'archiviert' : 'aktiv'}</p><h1>Projekte</h1></div>
      <div class="head-actions">
        ${nArch || arch ? `<button type="button" class="btn btn-ghost" data-act="toggleArchived">${arch ? 'Aktive zeigen' : `Archiv (${nArch})`}</button>` : ''}
        <button type="button" class="btn btn-primary" data-act="newProject">${UI.icon('plus')}Neues Projekt</button>
      </div>
    </div>
    ${list.length ? `<div class="project-grid">${cards}</div>` : `
