<style>
/* Pomodoro-Planer
 * Layout: Seitenleiste + Arbeitsfläche. Das Zifferblatt ist das einzige laute Objekt,
 * der Rest bleibt ruhig wie ein Laborjournal. Tomatenrot = Fokus, Salbei = Pause,
 * Indigo = lange Pause. Anime-Stil: Manga-Panels, Rasterpunkte, Tomaten-Chan. */

:root {
  color-scheme: light;
  --bg: #edf1f0;
  --bg-layers: none;
  --surface: #fbfcfc;
  --surface-2: #f1f5f4;
  --surface-3: #e3eae8;
  --ink: #132024;
  --ink-2: #3c4d53;
  --muted: #5f7076;
  --line: #d7dfdd;
  --line-strong: #b9c6c4;
  --outline: #132024;
  --tomato: #c63a29;
  --on-tomato: #ffffff;
  --sage: #217a6f;
  --on-sage: #ffffff;
  --indigo: #4859bd;
  --on-indigo: #ffffff;
  --leaf: #2f8a4c;
  --link: #1d60b3;
  --good: #137a3d;
  --warn: #965f00;
  --bad: #b5302a;
  --focus-ring: #1d60b3;
  --blush: #ff9cb8;
  --speed: rgb(19 32 36 / 0.08);
  --cat-lernen: #2a78d6;
  --cat-arbeit: #eb6834;
  --cat-sonstiges: #1baf7a;
  --pc-0: #8a9a9e;
  --pc-1: #2a78d6;
  --pc-2: #eb6834;
  --pc-3: #1baf7a;
  --pc-4: #eda100;
  --pc-5: #e87ba4;
  --pc-6: #008300;
  --pc-7: #6250d6;
  --pc-8: #e34948;
  --dial-track: #e3eae8;
  --tick: #b9c6c4;
  --tick-major: #3c4d53;
  --shadow: 0 1px 2px rgb(19 32 36 / 0.05), 0 12px 30px -20px rgb(19 32 36 / 0.3);
  --card-border: 1px solid var(--line);
  --card-shadow: var(--shadow);
  --radius: 14px;
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sidebar-w: 236px;
  --tabbar-h: 62px;
  --gutter: 32px;
  --phase: var(--tomato);
  --on-phase: var(--on-tomato);
}

/* Nachtmodus: System (ohne eigene Wahl), Viewer-Schalter, eigene Wahl «Nacht» */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-mode="tag"]) {
    color-scheme: dark;
    --bg: #0d1214; --surface: #151b1e; --surface-2: #1b2326; --surface-3: #252f33;
    --ink: #e3ebeb; --ink-2: #b4c2c4; --muted: #8b9b9e; --line: #263135; --line-strong: #3a4a50; --outline: #e3ebeb;
    --tomato: #f0644e; --on-tomato: #1b0d0a; --sage: #4cb4a5; --on-sage: #08201c; --indigo: #8d9aef; --on-indigo: #10142e;
    --leaf: #5cbf78; --link: #86b9f6; --good: #4cc77d; --warn: #e5a53d; --bad: #f2786b; --focus-ring: #86b9f6;
    --speed: rgb(227 235 235 / 0.07);
    --cat-lernen: #3987e5; --cat-arbeit: #d95926; --cat-sonstiges: #199e70;
    --pc-0: #6f8085; --pc-1: #3987e5; --pc-2: #d95926; --pc-3: #199e70; --pc-4: #c98500; --pc-5: #d55181; --pc-6: #1f9d3a; --pc-7: #9085e9; --pc-8: #e66767;
    --dial-track: #232c30; --tick: #3a4a50; --tick-major: #b4c2c4;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 14px 34px -20px rgb(0 0 0 / 0.8);
  }
}
:root[data-theme="dark"]:not([data-mode="tag"]),
:root[data-mode="nacht"] {
  color-scheme: dark;
  --bg: #0d1214; --surface: #151b1e; --surface-2: #1b2326; --surface-3: #252f33;
  --ink: #e3ebeb; --ink-2: #b4c2c4; --muted: #8b9b9e; --line: #263135; --line-strong: #3a4a50; --outline: #e3ebeb;
  --tomato: #f0644e; --on-tomato: #1b0d0a; --sage: #4cb4a5; --on-sage: #08201c; --indigo: #8d9aef; --on-indigo: #10142e;
  --leaf: #5cbf78; --link: #86b9f6; --good: #4cc77d; --warn: #e5a53d; --bad: #f2786b; --focus-ring: #86b9f6;
  --speed: rgb(227 235 235 / 0.07);
  --cat-lernen: #3987e5; --cat-arbeit: #d95926; --cat-sonstiges: #199e70;
  --pc-0: #6f8085; --pc-1: #3987e5; --pc-2: #d95926; --pc-3: #199e70; --pc-4: #c98500; --pc-5: #d55181; --pc-6: #1f9d3a; --pc-7: #9085e9; --pc-8: #e66767;
  --dial-track: #232c30; --tick: #3a4a50; --tick-major: #b4c2c4;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 14px 34px -20px rgb(0 0 0 / 0.8);
}
:root[data-mode="tag"] { color-scheme: light; }

/* Anime-Stil (Tag): Himmel, Rasterpunkte, Manga-Konturen */
:root[data-skin="anime"] {
  --bg: #fdf1f6;
  --bg-layers: radial-gradient(circle at 1px 1px, rgb(255 92 150 / 0.2) 1.1px, transparent 1.6px) 0 0 / 14px 14px, linear-gradient(180deg, #e6f2ff 0%, #fdeef5 55%, #fff5e6 100%);
  --surface: #ffffff; --surface-2: #fff3f8; --surface-3: #ffdfeb;
  --ink: #2a1838; --ink-2: #4a3460; --muted: #6f5d86; --line: #f0d2e1; --line-strong: #d9b3c9; --outline: #2a1838;
  --tomato: #e0285a; --on-tomato: #ffffff; --sage: #2bc4a0; --on-sage: #1d1030; --indigo: #7457f5; --on-indigo: #ffffff;
  --leaf: #2fbf71; --link: #5b3fd6; --focus-ring: #5b3fd6; --blush: #ff8fb1;
  --speed: rgb(42 24 56 / 0.1);
  --dial-track: #ffe0ec; --tick: #d9b3c9; --tick-major: #2a1838;
  --card-border: 2.5px solid var(--outline);
  --card-shadow: 5px 5px 0 var(--outline);
  --radius: 18px;
  --font-display: "Mochiy Pop One", "M PLUS Rounded 1c", ui-rounded, system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", ui-rounded, "Atkinson Hyperlegible", system-ui, sans-serif;
}
/* Anime-Stil (Nacht): Tokio bei Nacht, Neon, Sterne */
@media (prefers-color-scheme: dark) {
  :root[data-skin="anime"]:not([data-theme="light"]):not([data-mode="tag"]) {
    color-scheme: dark;
    --bg: #130d26;
    --bg-layers: radial-gradient(circle at 1px 1px, rgb(255 255 255 / 0.5) 0.9px, transparent 1.4px) 0 0 / 37px 41px, radial-gradient(circle at 1px 1px, rgb(255 190 235 / 0.35) 0.9px, transparent 1.4px) 11px 19px / 53px 47px, radial-gradient(ellipse at 15% 0%, rgb(255 79 154 / 0.22), transparent 55%), radial-gradient(ellipse at 90% 10%, rgb(90 170 255 / 0.2), transparent 50%), linear-gradient(180deg, #130d26, #1e1239 60%, #2a1240);
    --surface: #1d1634; --surface-2: #251c42; --surface-3: #33295c;
    --ink: #f7efff; --ink-2: #d6c8ec; --muted: #a998c8; --line: #3b2f60; --line-strong: #5a4a8a; --outline: #b9a6ff;
    --tomato: #ff5c8f; --on-tomato: #1a0f24; --sage: #3fe0c0; --on-sage: #0b1b22; --indigo: #a88fff; --on-indigo: #140d28;
    --leaf: #4fe08f; --link: #c4b2ff; --focus-ring: #c4b2ff; --blush: #ff7aa8;
    --good: #4cc77d; --warn: #e5a53d; --bad: #ff7d8f;
    --speed: rgb(185 166 255 / 0.14);
    --cat-lernen: #3987e5; --cat-arbeit: #d95926; --cat-sonstiges: #199e70;
    --pc-1: #3987e5; --pc-2: #d95926; --pc-3: #199e70; --pc-4: #c98500; --pc-5: #d55181; --pc-6: #1f9d3a; --pc-7: #9085e9; --pc-8: #e66767;
    --dial-track: #33295c; --tick: #5a4a8a; --tick-major: #b9a6ff;
    --card-shadow: 5px 5px 0 #ff4f9a;
  }
}
:root[data-skin="anime"][data-theme="dark"]:not([data-mode="tag"]),
:root[data-skin="anime"][data-mode="nacht"] {
  color-scheme: dark;
  --bg: #130d26;
  --bg-layers: radial-gradient(circle at 1px 1px, rgb(255 255 255 / 0.5) 0.9px, transparent 1.4px) 0 0 / 37px 41px, radial-gradient(circle at 1px 1px, rgb(255 190 235 / 0.35) 0.9px, transparent 1.4px) 11px 19px / 53px 47px, radial-gradient(ellipse at 15% 0%, rgb(255 79 154 / 0.22), transparent 55%), radial-gradient(ellipse at 90% 10%, rgb(90 170 255 / 0.2), transparent 50%), linear-gradient(180deg, #130d26, #1e1239 60%, #2a1240);
  --surface: #1d1634; --surface-2: #251c42; --surface-3: #33295c;
  --ink: #f7efff; --ink-2: #d6c8ec; --muted: #a998c8; --line: #3b2f60; --line-strong: #5a4a8a; --outline: #b9a6ff;
  --tomato: #ff5c8f; --on-tomato: #1a0f24; --sage: #3fe0c0; --on-sage: #0b1b22; --indigo: #a88fff; --on-indigo: #140d28;
  --leaf: #4fe08f; --link: #c4b2ff; --focus-ring: #c4b2ff; --blush: #ff7aa8;
  --good: #4cc77d; --warn: #e5a53d; --bad: #ff7d8f;
  --speed: rgb(185 166 255 / 0.14);
  --cat-lernen: #3987e5; --cat-arbeit: #d95926; --cat-sonstiges: #199e70;
  --pc-1: #3987e5; --pc-2: #d95926; --pc-3: #199e70; --pc-4: #c98500; --pc-5: #d55181; --pc-6: #1f9d3a; --pc-7: #9085e9; --pc-8: #e66767;
  --dial-track: #33295c; --tick: #5a4a8a; --tick-major: #b9a6ff;
  --card-shadow: 5px 5px 0 #ff4f9a;
}

[data-phase="focus"] { --phase: var(--tomato); --on-phase: var(--on-tomato); }
[data-phase="short"] { --phase: var(--sage); --on-phase: var(--on-sage); }
[data-phase="long"] { --phase: var(--indigo); --on-phase: var(--on-indigo); }

/* ---------- Grundlagen ---------- */
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  font: 16px/1.5 var(--font-body);
  color: var(--ink);
  background: var(--bg-layers), var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { text-wrap: balance; font-optical-sizing: auto; }
p { text-wrap: pretty; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.grow { flex: 1; }
kbd {
  font: 600 11px/1.4 var(--font-mono); padding: 1px 6px; border-radius: 6px;
  border: 1px solid var(--line-strong); border-bottom-width: 2px; background: var(--surface); color: var(--ink-2); white-space: nowrap;
}
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.logo { width: 30px; height: 30px; flex: none; }

/* ---------- App-Rahmen ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; gap: 18px;
  padding-block: 20px; padding-right: 14px; padding-left: max(14px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 55%, transparent);
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; font: 800 17px/1.1 var(--font-display); letter-spacing: -0.01em; padding: 2px 8px; min-width: 0; }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 0;
  background: transparent; font-weight: 700; font-size: 15px; color: var(--ink-2); text-align: left;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.is-on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / 0.06); }
.nav-item.is-on .ic { color: var(--tomato); }
.nav-item kbd { margin-left: auto; opacity: 0; transition: opacity 0.15s; }
.nav-item:hover kbd, .nav-item:focus-visible kbd { opacity: 1; }
.side-foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 0 2px; }

.topbar, .tabbar { display: none; }
.main {
  width: 100%; max-width: 1240px; margin: 0 auto; min-width: 0;
  padding-block: 28px 72px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  outline: none;
}
.connecting { display: none; }
.app.is-connecting .connecting {
  display: grid; place-items: center; position: fixed; inset: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 72%, transparent); font-weight: 700; color: var(--ink-2);
}

/* Mini-Timer in Seitenleiste / Kopfzeile */
.mt { display: flex; align-items: center; gap: 2px; padding: 6px 4px 6px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.mt-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--phase); flex: none; }
.mt.is-running .mt-dot { animation: pulse 1.6s ease-in-out infinite; }
.mt-clock { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: flex-start; padding: 0 6px; min-width: 0; line-height: 1.2; }
.mt-phase { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
.mt-clock .mono { font-size: 17px; font-weight: 500; }

/* ---------- Bausteine ---------- */
.card { background: var(--surface); border: var(--card-border); border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 20px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h2 { font: 700 18px/1.2 var(--font-display); margin: 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 22px; }
.view-head h1 { font: 700 clamp(28px, 4vw, 40px)/1.05 var(--font-display); letter-spacing: -0.02em; margin: 0; }
.eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pager { display: inline-flex; gap: 2px; align-items: center; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 14px 0 6px; }
.card > .label:first-child, .target-card .label { margin-top: 0; }
.hint { margin: -10px 0 16px; font-size: 13px; }
.empty-line { color: var(--muted); font-size: 14px; margin: 12px 0; }
.link { border: 0; background: none; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 2px; font-weight: 700; }
.row-gap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px;
  border-radius: 10px; border: 1px solid transparent; font-weight: 700; font-size: 14px; line-height: 1;
  white-space: nowrap; background: transparent; color: var(--ink); text-decoration: none;
}
.btn .ic { width: 18px; height: 18px; }
.btn-primary { background: var(--ink); color: var(--surface); }
.btn-primary:hover { background: color-mix(in srgb, var(--ink) 85%, var(--surface)); }
.btn-ghost { background: var(--surface); border-color: var(--line-strong); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--bad); color: #fff; }
.btn-danger-text { color: var(--bad); }
.btn-sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 0;
  background: transparent; color: var(--ink-2); flex: none; padding: 0;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 8px; }
.icon-btn.sm .ic { width: 18px; height: 18px; }
.icon-btn-solid { background: var(--ink); color: var(--surface); }
.icon-btn-solid:hover { background: color-mix(in srgb, var(--ink) 85%, var(--surface)); color: var(--surface); }

input, select, textarea {
  font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 10px; min-height: 40px; padding: 0 12px; min-width: 0;
}
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 0; border-color: transparent; }
textarea { padding: 10px 12px; resize: vertical; line-height: 1.45; }
input[type="checkbox"], input[type="radio"], input[type="range"] { min-height: 0; }
input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="range"] { accent-color: var(--tomato); padding: 0; border: 0; background: transparent; }
select {
  appearance: none; padding-right: 34px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px; background-repeat: no-repeat;
}
::placeholder { color: var(--muted); opacity: 0.8; }

.switch { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; cursor: pointer; }
.switch input {
  appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--surface-3);
  border: 1px solid var(--line-strong); position: relative; flex: none; margin: 0; cursor: pointer; transition: background 0.15s;
}
.switch input::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / 0.35); transition: transform 0.15s;
}
.switch input:checked { background: var(--sage); border-color: var(--sage); }
.switch input:checked::after { transform: translateX(18px); }
.switch > span { font-weight: 700; font-size: 15px; }
.switch small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); max-width: 100%; }
.seg-btn {
  position: relative; border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; font-weight: 700; font-size: 14px;
  color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; cursor: pointer;
}
.seg-btn .ic { width: 16px; height: 16px; }
.seg-btn.is-on, .seg-radio .seg-btn:has(input:checked) { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.14), inset 0 0 0 1px var(--line); }
.seg-radio .seg-btn input { position: absolute; opacity: 0; pointer-events: none; }
.seg-radio .seg-btn:has(input:focus-visible) { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.seg-wide { display: flex; }
.seg-wide .seg-btn { flex: 1; }

.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface); font-size: 14px;
}
.chip .mono { font-size: 11px; color: var(--muted); }
.chip .ic { width: 15px; height: 15px; align-self: center; }
.chip.is-on { border-color: var(--phase); background: color-mix(in srgb, var(--phase) 10%, var(--surface)); }
.chip-link { border-style: dashed; color: var(--ink-2); }

.pchip, .cchip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap; max-width: 100%; min-width: 0; }
.pchip { overflow: hidden; text-overflow: ellipsis; }
.pchip i { width: 9px; height: 9px; border-radius: 3px; background: var(--pc); flex: none; }
.cchip { padding: 1px 9px 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--cc) 13%, var(--surface)); }
.cchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--cc); flex: none; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.badge .ic { width: 13px; height: 13px; }
.badge.is-soon { color: var(--warn); }
.badge.is-late { color: var(--bad); }
.badge-pomo { color: var(--tomato); }

.meter { --meter: var(--tomato); height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--meter) 15%, var(--surface-2)); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--meter); border-radius: inherit; transition: width 0.3s; }
.meter-pc { --meter: var(--pc); }
.meter-load { --meter: var(--sage); }
.meter-load.is-over { --meter: var(--bad); }
.meter-thin { height: 4px; }
.meter-label { display: flex; justify-content: space-between; font-size: 12px; }

.pdots { display: inline-flex; gap: 3px; align-items: center; flex: none; }
.pdots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--tomato); }
.pdots i.is-on { background: var(--tomato); }
.pdots i.is-over { background: var(--warn); border-color: var(--warn); }
.pdots b { font: 600 11px var(--font-mono); color: var(--muted); margin-left: 2px; }

/* Aufgabenliste */
.task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.task-list.card { padding: 4px 12px; }
.task { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.task:last-child { border-bottom: 0; }
.task.is-target { background: color-mix(in srgb, var(--tomato) 7%, transparent); border-radius: 10px; }
.check { position: relative; display: grid; place-items: center; width: 36px; height: 36px; flex: none; cursor: pointer; }
.check input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.check-box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line-strong); display: grid; place-items: center; color: transparent; transition: background 0.15s, border-color 0.15s; }
.check-box .ic { width: 14px; height: 14px; stroke-width: 3; }
.check input:checked + .check-box { background: var(--good); border-color: var(--good); color: #fff; }
.check input:focus-visible + .check-box { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.task-main { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 7px 6px; border-radius: 8px; display: flex; flex-direction: column; gap: 3px; }
.task-main:hover { background: var(--surface-2); }
.task-title { font-weight: 700; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; line-height: 1.3; }
.task-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.meta { display: inline-flex; align-items: center; gap: 4px; }
.meta .ic { width: 14px; height: 14px; }
.is-overdue { color: var(--bad); }
.task.is-done .task-title { text-decoration: line-through; color: var(--muted); font-weight: 400; }
.play-btn { color: var(--tomato); }
.play-btn.is-on { background: var(--tomato); color: var(--on-tomato); }
.play-btn .ic { width: 18px; height: 18px; }
.play-gap { width: 40px; flex: none; }

.quick-add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.quick-add input[name="title"], .quick-add input[name="name"] { flex: 3 1 150px; }
.quick-add select { flex: 1 1 110px; max-width: 190px; }
.quick-add input[type="number"] { width: 68px; flex: none; text-align: center; padding: 0 6px; }
.quick-add input[type="date"] { flex: 0 1 160px; }

.empty { text-align: center; padding: 40px 20px; }
.empty h2 { font: 700 20px var(--font-display); margin: 0 0 8px; }
.empty p { color: var(--ink-2); max-width: 54ch; margin: 0 auto 18px; }
.empty .row-gap { justify-content: center; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface); border: var(--card-border); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile-label { font-size: 13px; color: var(--muted); font-weight: 700; }
.tile-value { font: 700 24px/1.15 var(--font-display); }
.tile-hero .tile-value { font-size: 32px; }
.tile-sub { font-size: 13px; color: var(--muted); }
.tile-sub.is-up { color: var(--good); }
.tile .meter { margin-top: 4px; }

.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 20px; align-items: start; }
.mini-title { font: 700 14px var(--font-display); margin: 22px 0 8px; color: var(--ink-2); }
.log-list { list-style: none; margin: 0; padding: 0; }
.log-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; width: 100%; border: 0; background: none;
  padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: left; align-items: baseline; font-size: 14px;
}
.log-item:hover { background: var(--surface-2); }
.log-item .mono { font-size: 12px; color: var(--ink-2); }
.log-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Fokus ---------- */
.focus-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.timer-card { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 20px 24px; }
.phase-tabs { position: relative; display: flex; gap: 3px; padding: 4px; background: var(--surface-2); border-radius: 999px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.phase-tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.phase-tab .mono { font-size: 11px; color: var(--muted); font-weight: 400; }
.phase-tab.is-on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.14); }
.phase-tab.is-on::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--phase); }
.dial-wrap { position: relative; width: min(100%, 340px); aspect-ratio: 1; margin: 4px auto 0; }
.dial { display: block; width: 100%; height: 100%; }
.dial .tk { stroke: var(--tick); stroke-width: 1.5; stroke-linecap: round; }
.dial .tk-major { stroke: var(--tick-major); stroke-width: 2.6; }
.dial-track { fill: none; stroke: var(--dial-track); stroke-width: 16; }
.dial-arc { fill: none; stroke: var(--phase); stroke-width: 16; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear, stroke 0.3s; }
.dial-knob { fill: var(--surface); stroke: var(--phase); stroke-width: 4; transition: cx 0.3s linear, cy 0.3s linear; }
.dial-center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 4px; }
.clock { font-family: var(--font-mono); font-weight: 500; font-size: clamp(44px, 12.5vw, 66px); letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.dial-sub { text-transform: uppercase; letter-spacing: 0.16em; font-size: 12px; font-weight: 700; color: var(--muted); }
.round { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.round-dots { display: inline-flex; gap: 5px; }
.round-dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line-strong); }
.round-dots i.is-on { background: var(--tomato); border-color: var(--tomato); }
.round-dots i.is-now { border-color: var(--tomato); }
.controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 4px; }
.btn-start {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 60px; min-width: 156px; padding: 0 30px;
  border-radius: 999px; border: 0; background: var(--phase); color: var(--on-phase);
  font: 700 18px/1 var(--font-display); letter-spacing: 0.01em; box-shadow: 0 10px 24px -12px var(--phase); transition: transform 0.1s;
}
.btn-start .ic { width: 22px; height: 22px; }
.btn-start:active { transform: scale(0.97); }
.btn-round { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); font: 600 14px var(--font-mono); color: var(--ink-2); }
.btn-round:hover { background: var(--surface-2); }
.controls-2 { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; min-height: 40px; }
.kbd-hint { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
.focus-side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.target-card select { width: 100%; }
.target-info { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
.target-progress { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.target-info .btn { margin-left: auto; }
.today-sum { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.big-num { font: 700 26px var(--font-display); }
.cat-line { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; align-items: center; }
.cat-line > span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- Aufgaben ---------- */
.add-task { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 16px; padding: 14px; }
.grow-input { flex: 1 1 260px; }
.field-inline { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; }
.field-inline input[type="number"] { width: 90px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; align-items: center; }
.filters input[type="search"] { flex: 1 1 160px; }
.task-group { margin-bottom: 20px; }
.group-title { font: 700 15px var(--font-display); margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.task-group.is-overdue .group-title { color: var(--bad); }

/* ---------- Projekte ---------- */
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.project-card { text-align: left; display: flex; flex-direction: column; gap: 14px; transition: transform 0.12s, border-color 0.12s; }
.project-card:hover { transform: translateY(-2px); }
.pc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pc-swatch { width: 14px; height: 14px; border-radius: 4px; background: var(--pc); flex: none; }
.pc-name { font: 700 19px/1.2 var(--font-display); overflow-wrap: anywhere; }
.pc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pc-stats > span { display: flex; flex-direction: column; min-width: 0; }
.pc-stats b { font-size: 15px; font-weight: 500; }
.pc-stats small { color: var(--muted); font-size: 12px; }
.pc-progress { display: flex; flex-direction: column; gap: 6px; }
.back { display: inline-flex; align-items: center; gap: 2px; margin-bottom: 10px; text-decoration: none; font-size: 14px; }
.back .ic { width: 18px; height: 18px; }
.with-swatch { display: flex; align-items: center; gap: 12px; }
.with-swatch .pc-swatch { width: 20px; height: 20px; border-radius: 6px; }
.sub-line { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; align-items: center; }
.notes { color: var(--ink-2); max-width: 70ch; margin: -8px 0 18px; white-space: pre-wrap; }
.done-list summary { cursor: pointer; color: var(--muted); font-weight: 700; padding: 12px 0 4px; font-size: 14px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; background: var(--pc); cursor: pointer; position: relative; }
.swatch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.swatch:has(input:checked) { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.swatch:has(input:focus-visible) { outline: 2px solid var(--focus-ring); outline-offset: 5px; }

/* ---------- Diagramme ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 14px; font-size: 13px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 10px; height: 10px; border-radius: 2px; }
.lg b { color: var(--ink); font-weight: 500; font-size: 12px; }
.chart { --plot-h: 210px; }
.chart-plot { position: relative; height: var(--plot-h); margin-left: 48px; }
.cg-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line); }
.cg-line.is-base { border-top-color: var(--line-strong); }
.cg-line span { position: absolute; right: calc(100% + 8px); top: -8px; font: 10.5px/1.4 var(--font-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chart-cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; align-items: end; }
.cc { height: 100%; display: flex; align-items: flex-end; justify-content: center; border-radius: 6px 6px 0 0; outline-offset: 0; }
.cc:hover, .cc:focus-visible { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.cc-bar { width: min(24px, 72%); display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
.cc-bar i { display: block; min-height: 2px; flex-basis: 0; }
.chart-x { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; margin-left: 48px; margin-top: 6px; font: 10.5px/1.4 var(--font-mono); color: var(--muted); text-align: center; }
.chart-x span { overflow: visible; white-space: nowrap; }
.tip {
  position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; background: var(--ink); color: var(--surface);
  padding: 8px 12px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); min-width: 130px; max-width: 260px;
}
.tip-title { font-size: 12px; opacity: 0.8; }
.tip-total { font: 700 17px/1.2 var(--font-display); margin: 2px 0 4px; }
.tip-row { display: flex; align-items: center; gap: 8px; line-height: 1.5; }
.tip-row i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tip-row b { font: 500 12px var(--font-mono); min-width: 40px; }
.pb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.pb-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(50px, 1fr) auto auto; gap: 10px; align-items: center; font-size: 14px; }
.pb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; font-weight: 700; color: var(--ink); }
.pb-name.link { text-decoration: none; }
.pb-name.link:hover { text-decoration: underline; }
.pb-bar { height: 10px; overflow: hidden; }
.pb-bar i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.pb-val { font-size: 12px; }
.pb-pct { font-size: 12px; min-width: 40px; text-align: right; }
.summary { font: 12.5px/1.65 var(--font-mono); white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 14px; margin: 0; max-height: 380px; overflow: auto; color: var(--ink-2); }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table .mono { font-size: 12px; }
.table .pchip, .table .cchip { margin-left: 6px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-details summary { cursor: pointer; color: var(--ink-2); font-weight: 700; font-size: 14px; margin-top: 16px; }
.table-details .table { margin-top: 8px; }

/* ---------- Kalender ---------- */
.week-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.backlog { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 8px; padding: 14px; }
.backlog .card-head { margin-bottom: 0; }
.backlog .small { margin: 0 0 4px; }
.week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wk-col { background: var(--surface); border: var(--card-border); border-radius: 12px; padding: 10px 7px; display: flex; flex-direction: column; gap: 8px; min-height: 300px; min-width: 0; transition: background 0.12s; }
.wk-col.is-past { background: var(--surface-2); }
.wk-col.is-today { box-shadow: inset 0 0 0 2px var(--tomato); }
.wk-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 4px; padding: 0 2px; }
.wk-day { display: flex; flex-direction: column; line-height: 1.1; }
.wk-wd { font: 700 12px var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.wk-col.is-today .wk-wd { color: var(--tomato); }
.wk-date { font: 700 18px var(--font-display); }
.wk-load { font: 500 11px var(--font-mono); color: var(--muted); }
.wk-load.is-over { color: var(--bad); }
.wk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.wk-card { position: relative; background: color-mix(in srgb, var(--pc) 13%, var(--surface)); border-radius: 8px; display: flex; flex-direction: column; cursor: grab; min-width: 0; }
.wk-card-main { border: 0; background: none; text-align: left; padding: 7px 7px 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.wk-title { font-weight: 700; font-size: 13px; line-height: 1.3; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.wk-meta { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-time { font-size: 11px; color: var(--ink-2); }
.wk-card .pdots i { width: 7px; height: 7px; }
.wk-move { display: flex; justify-content: flex-end; padding: 0 2px 2px; }
.backlog .wk-card { flex-direction: row; align-items: center; }
.backlog .wk-card-main { flex: 1; }
.wk-card.is-done .wk-title { text-decoration: line-through; color: var(--muted); }
.wk-add { border: 1px dashed var(--line-strong); background: transparent; border-radius: 8px; color: var(--muted); font-weight: 700; font-size: 12px; padding: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 32px; }
.wk-add:hover { color: var(--ink); border-color: var(--ink-2); }
.wk-add .ic { width: 14px; height: 14px; }
.wk-foot { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; margin-top: auto; min-height: 16px; }
.wk-foot .ic { width: 13px; height: 13px; }
.is-dragging { opacity: 0.4; }
.is-drop { background: color-mix(in srgb, var(--sage) 14%, var(--surface)) !important; outline: 2px dashed var(--sage); outline-offset: -2px; }
.cal-deadline { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--ink-2); min-width: 0; }
.cal-deadline .ic { width: 12px; height: 12px; color: var(--pc); flex: none; stroke-width: 2.4; }
.cal-deadline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-panel .cal-deadline { font-size: 13px; margin-bottom: 8px; }

.month-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.month-card { padding: 10px; }
.month-grid { display: grid; grid-template-columns: 30px repeat(7, minmax(0, 1fr)); gap: 4px; }
.month-head { font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; text-align: center; margin-bottom: 4px; }
.kw { font: 10px var(--font-mono); color: var(--muted); display: flex; justify-content: center; padding-top: 9px; }
.month-head .kw { padding-top: 0; font-family: var(--font-body); font-size: 10px; }
.cal-cell { min-height: 108px; background: var(--surface-2); border-radius: 8px; padding: 4px 5px 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; border: 1.5px solid transparent; }
.cal-cell:hover { border-color: var(--line-strong); }
.cal-cell.is-out { opacity: 0.5; }
.cal-cell.is-sel { border-color: var(--ink); }
.cal-top { display: flex; justify-content: space-between; align-items: center; gap: 2px; }
.cal-num { border: 0; background: none; font-weight: 700; font-size: 13px; width: 26px; height: 26px; border-radius: 50%; padding: 0; flex: none; }
.cal-cell.is-today .cal-num { background: var(--tomato); color: var(--on-tomato); }
.cal-logged { font-size: 10px; color: var(--muted); overflow: hidden; }
.cal-items { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal-chip { border: 0; text-align: left; font-weight: 700; font-size: 11.5px; line-height: 1.3; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, var(--pc) 20%, var(--surface)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cal-chip.is-done { text-decoration: line-through; color: var(--muted); font-weight: 400; }
.cal-more { font-size: 11px; color: var(--muted); padding-left: 4px; }
.cal-dots { display: none; gap: 3px; flex-wrap: wrap; }
.cal-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--pc); }
.cal-dots i.is-done { opacity: 0.35; }
.cal-cell .meter { margin-top: auto; }
.day-panel { position: sticky; top: 20px; }
.day-panel .card-head { margin-bottom: 4px; }
.day-panel > .small { margin: 0 0 10px; }

/* ---------- Einstellungen ---------- */
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; align-items: start; }
.num-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 16px; margin-bottom: 8px; }
.num-field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper input { width: 64px; flex: none; text-align: center; padding: 0 4px; }
.unit { font-size: 12px; color: var(--muted); margin-left: 4px; }
.preset-list { list-style: none; margin: 0; padding: 0; }
.preset-list li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.preset-apply { flex: 1; border: 0; background: none; text-align: left; padding: 10px 4px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.preset-apply .mono { font-size: 11px; }
.range-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 0; font-weight: 700; font-size: 14px; }
.range-row input[type="range"] { flex: 1 1 140px; }
.kbd-list { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.kbd-list div { display: flex; gap: 12px; align-items: center; }
.kbd-list dt { min-width: 110px; }
.kbd-list dd { margin: 0; color: var(--ink-2); font-size: 14px; }
.btn-col { display: flex; flex-direction: column; gap: 8px; }
.btn-col .btn { justify-content: flex-start; }
.save-state { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.save-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
.save-state[data-state="saving"]::before { background: var(--warn); }
.save-state[data-state="error"] { color: var(--bad); }
.save-state[data-state="error"]::before { background: var(--bad); }

/* ---------- Dialog, Toast ---------- */
.dlg {
  border: var(--card-border); border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
  background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -20px rgb(0 0 0 / 0.5);
}
.dlg::backdrop { background: rgb(8 14 16 / 0.5); }
.dlg-form { display: flex; flex-direction: column; max-height: calc(100dvh - 36px); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 12px 6px 20px; }
.dlg-head h2 { margin: 0; font: 700 20px/1.2 var(--font-display); }
.dlg-body { padding: 8px 20px 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); align-items: center; }
.dlg-text { margin: 0; color: var(--ink-2); line-height: 1.55; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 160px; border: 0; padding: 0; margin: 0; }
.field > label, .field > legend { font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 0; }
.field > legend { margin-bottom: 8px; }
.field-row { display: flex; gap: 12px; flex-wrap: wrap; }
.field-s { flex: 0 1 120px; }
.toasts {
  position: fixed; z-index: 120; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(520px, calc(100vw - 32px)); pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--surface);
  padding: 10px 10px 10px 16px; border-radius: 12px; box-shadow: var(--shadow); font-size: 14px; max-width: 100%;
  animation: toast-in 0.2s ease-out; transition: opacity 0.3s, transform 0.3s;
}
.toast.is-out { opacity: 0; transform: translateY(6px); }
.toast-btn { border: 0; background: transparent; color: inherit; font-weight: 700; font-size: 14px; text-decoration: underline; padding: 6px 8px; white-space: nowrap; }

/* ---------- Mini-Ansicht & schwebendes Fenster ---------- */
body.is-mini .app { display: none; }
.mini-root {
  min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mini { width: min(100%, 360px); background: var(--surface); border: var(--card-border); border-radius: 20px; box-shadow: var(--card-shadow); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
.mini-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mini-phase { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.mini-phase i { width: 10px; height: 10px; border-radius: 50%; background: var(--phase); }
.mini-body { display: flex; align-items: center; justify-content: center; gap: 10px; }
.mini-clock { font-weight: 500; font-size: 52px; line-height: 1; letter-spacing: -0.05em; text-align: center; }
.mini-mascot .mascot { width: 60px; height: 60px; }
.mini-bar { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--phase) 18%, var(--surface-2)); overflow: hidden; }
.mini-bar i { display: block; height: 100%; width: 0; background: var(--phase); border-radius: inherit; transition: width 0.3s linear; }
.mini-task { font-size: 13px; color: var(--muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-ctrl { display: flex; justify-content: center; align-items: center; gap: 10px; }
.btn-start-sm { height: 46px; min-width: 132px; font-size: 16px; padding: 0 22px; }
.mini-hint { margin: 0; text-align: center; font-size: 11px; color: var(--muted); }
body.pip { margin: 0; min-height: 100vh; overflow: hidden; }
body.pip #pipRoot { min-height: 100vh; display: grid; place-items: center; padding: 6px; }
body.pip .mini { width: 100%; border: 0; box-shadow: none; background: transparent; padding: 4px 10px; }

/* ---------- Anime-Stil: Extras ---------- */
[data-skin="anime"] .view-head h1, [data-skin="anime"] .brand, [data-skin="anime"] .wk-date, [data-skin="anime"] .tile-value, [data-skin="anime"] .big-num { font-weight: 400; }
[data-skin="anime"] .brand { font-size: 15px; }
[data-skin="anime"] .view-head h1 { text-shadow: 3px 3px 0 color-mix(in srgb, var(--tomato) 30%, transparent); }
[data-skin="anime"] :is(.btn-primary, .btn-ghost, .btn-start, .btn-round, .chip, .icon-btn-solid) { border: 2px solid var(--outline); box-shadow: 3px 3px 0 var(--outline); }
[data-skin="anime"] :is(.btn-primary, .btn-ghost, .btn-start, .btn-round, .chip, .icon-btn-solid):active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
[data-skin="anime"] .btn-start { font-weight: 400; }
[data-skin="anime"] .nav-item.is-on { box-shadow: inset 0 0 0 2px var(--outline), 3px 3px 0 var(--outline); }
[data-skin="anime"] .phase-tabs { border: 2px solid var(--outline); }
[data-skin="anime"] .dial-track, [data-skin="anime"] .dial-arc { stroke-width: 18; }
[data-skin="anime"] .dial-knob { stroke: var(--outline); stroke-width: 3; fill: var(--phase); }
[data-skin="anime"] .clock { font-family: var(--font-display); letter-spacing: 0; font-size: clamp(42px, 11.5vw, 60px); }
[data-skin="anime"] .mini-clock { font-family: var(--font-display); letter-spacing: 0; font-size: 44px; }
[data-skin="anime"] .wk-col, [data-skin="anime"] .tile { box-shadow: 3px 3px 0 var(--outline); }
[data-skin="anime"] .toast { border: 2px solid var(--outline); }
.speedlines {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 50% 44%, var(--speed) 0deg 1.4deg, transparent 1.4deg 7deg);
  -webkit-mask-image: radial-gradient(circle at 50% 44%, transparent 30%, #000 62%);
  mask-image: radial-gradient(circle at 50% 44%, transparent 30%, #000 62%);
}
.timer-card:has(.dial-wrap.is-running) .speedlines { animation: speed 1.8s ease-in-out infinite; }
.timer-card > :not(.speedlines):not(.petals) { position: relative; }
.kanji { font: 400 16px/1 var(--font-display); color: var(--phase); letter-spacing: 0.3em; margin-right: -0.3em; }
.mascot-wrap { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: -4px; }
.mascot { width: 74px; height: 74px; flex: none; overflow: visible; animation: bob 2.6s ease-in-out infinite; }
.bubble {
  position: relative; margin: 0; background: var(--surface); border: 2px solid var(--outline); border-radius: 16px;
  padding: 8px 14px; font: 400 14px/1.35 var(--font-display); color: var(--ink); box-shadow: 2px 2px 0 var(--outline); max-width: 220px;
}
.bubble::before {
  content: ""; position: absolute; left: -8px; top: 50%; width: 13px; height: 13px; background: var(--surface);
  border-left: 2px solid var(--outline); border-bottom: 2px solid var(--outline); transform: translateY(-50%) rotate(45deg);
}
.m-body { fill: var(--tomato); stroke: var(--outline); stroke-width: 3; }
.m-shine { fill: #ffffff; opacity: 0.55; }
.m-leaf { fill: var(--leaf); stroke: var(--outline); stroke-width: 2.5; stroke-linejoin: round; }
.m-stem { fill: none; stroke: var(--outline); stroke-width: 3; stroke-linecap: round; }
.m-blush { fill: var(--blush); opacity: 0.8; }
.m-ink { fill: #24122f; }
.m-white { fill: #ffffff; }
.m-line { fill: none; stroke: #24122f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.m-mouth { fill: #7a1530; stroke: #24122f; stroke-width: 2.5; stroke-linejoin: round; }
.m-zzz { font: 700 15px var(--font-display); fill: var(--ink-2); }
.m-zzz-2 { font-size: 11px; }
.m-spark { fill: #ffd23f; stroke: var(--outline); stroke-width: 1.5; }
.m-sweat { fill: #8fd8ff; stroke: var(--outline); stroke-width: 1.5; }
.petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; display: none; }
.focus-grid:is([data-phase="short"], [data-phase="long"]) .petals { display: block; }
.petals i { position: absolute; top: -16px; width: 12px; height: 9px; background: #ffb3cc; border-radius: 12px 0 12px 0; opacity: 0.9; animation: fall 10s linear infinite; }
.petals i:nth-child(1) { left: 6%; animation-delay: -1s; }
.petals i:nth-child(2) { left: 22%; animation-delay: -6s; animation-duration: 12s; }
.petals i:nth-child(3) { left: 41%; animation-delay: -3s; animation-duration: 9s; }
.petals i:nth-child(4) { left: 63%; animation-delay: -8s; animation-duration: 11s; }
.petals i:nth-child(5) { left: 80%; animation-delay: -4.5s; }
.petals i:nth-child(6) { left: 93%; animation-delay: -2s; animation-duration: 13s; }

@keyframes pulse { 50% { transform: scale(1.5); opacity: 0.6; } }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
@keyframes speed { 50% { opacity: 0.45; } }
@keyframes fall {
  0% { transform: translate(0, 0) rotate(0deg); }
  50% { transform: translate(28px, 340px) rotate(200deg); }
  100% { transform: translate(-12px, 720px) rotate(420deg); opacity: 0; }
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Responsiv ---------- */
@media (max-width: 1240px) {
  .focus-grid { grid-template-columns: minmax(0, 1fr); }
  .month-layout { grid-template-columns: minmax(0, 1fr); }
  .day-panel { position: static; }
}
@media (max-width: 1100px) {
  .week-layout { grid-template-columns: minmax(0, 1fr); }
  .backlog { position: static; }
  .backlog .wk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .two-col { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 899px) {
  :root { --gutter: 16px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .topbar {
    display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; align-items: center; gap: 4px;
    padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
    background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .brand { padding: 0; margin-right: auto; font-size: 16px; }
  .mt-top { background: transparent; border: 0; padding: 0 0 0 6px; }
  .mt-top .mt-clock { flex-direction: row; align-items: baseline; gap: 6px; }
  .app[data-view="fokus"] .mt-top { display: none; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; font-weight: 700; font-size: 11px; color: var(--muted); padding: 4px 2px; border-radius: 10px; min-width: 0; }
  .tab .ic { width: 22px; height: 22px; }
  .tab span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
  .tab.is-on { color: var(--ink); }
  .tab.is-on .ic { color: var(--tomato); }
  .main { padding-block: 20px calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom, 0px)); }
  .toasts { bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px)); }
  [data-skin="anime"] .tabbar { border-top: 2.5px solid var(--outline); }
}
@media (max-width: 700px) {
  .week-grid { grid-template-columns: minmax(0, 1fr); }
  .wk-col { min-height: 0; }
  .week-layout .backlog { order: 2; }
  .month-grid { grid-template-columns: 20px repeat(7, minmax(0, 1fr)); gap: 3px; }
  .month-card { padding: 6px; }
  .cal-cell { min-height: 62px; padding: 3px; }
  .cal-items, .cal-logged, .cal-deadline span { display: none; }
  .cal-dots { display: flex; }
  .kw { font-size: 9px; }
  .settings-grid { grid-template-columns: minmax(0, 1fr); }
  .pb-row { grid-template-columns: minmax(0, 1fr) auto auto; }
  .pb-bar { grid-column: 1 / -1; order: 4; }
  .chart { --plot-h: 170px; }
}
@media (max-width: 520px) {
  .topbar .brand span { display: none; }
  .phase-tab .mono { display: none; }
  .phase-tab { padding: 8px 12px; }
  .controls { gap: 12px; }
  .btn-start { min-width: 140px; padding: 0 22px; }
  .card { padding: 16px; }
  .view-head h1 { font-size: 28px; }
  .tile-hero .tile-value { font-size: 28px; }
  .head-actions { width: 100%; }
  .filters .seg { width: 100%; }
  .filters .seg-btn { flex: 1; padding: 6px 8px; }
  .mascot { width: 62px; height: 62px; }
  .bubble { font-size: 13px; }
}
@media (pointer: coarse) {
  .icon-btn.sm { width: 40px; height: 40px; }
  .kbd-hint, .nav-item kbd, .mini-hint { display: none; }
  .wk-card { cursor: default; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .petals { display: none !important; }
}
@media (forced-colors: active) {
  .dial-arc { stroke: Highlight; }
  .cc-bar i, .pb-bar i, .meter i { background: CanvasText !important; }
}
